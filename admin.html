<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Login | R Mohan Digital</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #102a52 0%, #050b16 45%, #02050a 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
        }

        .login-box {
            background: rgba(5, 14, 28, 0.95);
            border: 1px solid rgba(0, 180, 255, 0.35);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow:
                0 0 25px rgba(0, 170, 255, 0.18),
                inset 0 0 25px rgba(0, 170, 255, 0.03);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-icon {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #00b7ff, #0066ff);
            color: white;
            font-size: 25px;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(0, 170, 255, 0.45);
        }

        .brand h1 {
            margin-top: 15px;
            font-size: 25px;
        }

        .brand p {
            margin-top: 7px;
            color: #72cfff;
            font-size: 12px;
            letter-spacing: 3px;
        }

        .section-title {
            color: #9bdfff;
            font-size: 14px;
            margin-bottom: 12px;
        }

        /* ROLE BUTTONS */

        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .role-btn {
            border: 1px solid rgba(0, 190, 255, 0.25);
            background: rgba(10, 27, 49, 0.9);
            color: #cdeeff;
            border-radius: 12px;
            padding: 13px 10px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .role-btn:hover {
            border-color: #00b7ff;
            background: rgba(0, 150, 255, 0.12);
            transform: translateY(-1px);
        }

        .role-btn.selected {
            border-color: #00c8ff;
            background: rgba(0, 160, 255, 0.2);
            color: white;
            box-shadow:
                0 0 12px rgba(0, 190, 255, 0.25);
        }

        .selected-role {
            text-align: center;
            min-height: 22px;
            margin: 4px 0 20px;
            color: #00d9ff;
            font-size: 13px;
            font-weight: bold;
        }

        /* INPUTS */

        .input-group {
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            color: #a9dfff;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 48px;
            padding: 0 48px 0 15px;
            border-radius: 12px;
            border: 1px solid rgba(0, 180, 255, 0.25);
            background: #071525;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .input-wrapper input:focus {
            border-color: #00bfff;
            box-shadow: 0 0 12px rgba(0, 190, 255, 0.15);
        }

        .input-wrapper input::placeholder {
            color: #688198;
        }

        /* PASSWORD EYE */

        .toggle-password {
            position: absolute;
            right: 7px;
            top: 7px;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .toggle-password:hover {
            background: rgba(0, 180, 255, 0.12);
        }

        /* LOGIN BUTTON */

        #loginButton {
            width: 100%;
            height: 50px;
            margin-top: 5px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(90deg, #008cff, #00c6ff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(0, 170, 255, 0.25);
            transition: 0.2s ease;
        }

        #loginButton:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 25px rgba(0, 190, 255, 0.4);
        }

        #loginButton:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        #loginMessage {
            min-height: 22px;
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        .security-note {
            text-align: center;
            margin-top: 22px;
            color: #607991;
            font-size: 11px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 27px 20px;
            }

            .roles {
                gap: 8px;
            }

            .role-btn {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <!-- BRAND -->
        <div class="brand">
            <div class="brand-icon">RM</div>

            <h1>R Mohan Digital</h1>

            <p>CONTROL CENTER</p>
        </div>


        <!-- ROLE -->
        <div class="section-title">
            Select your access
        </div>

        <div class="roles">

            <button
                type="button"
                class="role-btn"
                data-role="mentor">
                👨‍🏫 Mentor
            </button>

            <button
                type="button"
                class="role-btn"
                data-role="admin">
                👑 Owner
            </button>

            <button
                type="button"
                class="role-btn"
                data-role="editor">
                ✏️ Editor
            </button>

            <button
                type="button"
                class="role-btn"
                data-role="faculty">
                🎓 Faculty
            </button>

        </div>

        <div
            id="selectedRoleText"
            class="selected-role">
            Please select an access role
        </div>


        <!-- EMAIL -->
        <div class="input-group">

            <label for="loginEmail">
                Email Address
            </label>

            <div class="input-wrapper">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your team email"
                    autocomplete="username">

            </div>

        </div>


        <!-- PASSWORD -->
        <div class="input-group">

            <label for="loginPassword">
                Password
            </label>

            <div class="input-wrapper">

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password">

                <button
                    type="button"
                    class="toggle-password"
                    id="toggleLoginPassword"
                    aria-label="Show password"
                    title="Show password">

                    <span id="eyeOpen">👁</span>
                    <span
                        id="eyeClosed"
                        style="display:none;">
                        🙈
                    </span>

                </button>

            </div>

        </div>


        <!-- LOGIN -->
        <button
            type="button"
            id="loginButton">

            Team Login

        </button>


        <!-- MESSAGE -->
        <div id="loginMessage"></div>


        <div class="security-note">
            🔐 Authorized team members only
        </div>

    </div>

</div>


<!-- =====================================================
     ROLE SELECTION
===================================================== -->

<script>

    window.selectedLoginRole = "";

    document.addEventListener("DOMContentLoaded", function () {

        const roleButtons =
            document.querySelectorAll(".role-btn");

        const selectedRoleText =
            document.getElementById("selectedRoleText");


        roleButtons.forEach(function (button) {

            button.addEventListener("click", function () {

                roleButtons.forEach(function (btn) {
                    btn.classList.remove("selected");
                });

                button.classList.add("selected");

                window.selectedLoginRole =
                    button.dataset.role;

                const roleName =
                    button.textContent
                        .replace(/[^\w\s]/g, "")
                        .trim();

                selectedRoleText.textContent =
                    "Selected: " + roleName;

            });

        });

    });

</script>


<!-- =====================================================
     PASSWORD SHOW / HIDE
     THIS IS THE ONLY PASSWORD EYE CODE
===================================================== -->

<script>

    function toggleTeamPassword(event) {

        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        const password =
            document.getElementById("loginPassword");

        const eyeOpen =
            document.getElementById("eyeOpen");

        const eyeClosed =
            document.getElementById("eyeClosed");

        const button =
            document.getElementById("toggleLoginPassword");


        if (!password) {
            return;
        }


        if (password.type === "password") {

            password.type = "text";

            if (eyeOpen) {
                eyeOpen.style.display = "none";
            }

            if (eyeClosed) {
                eyeClosed.style.display = "inline";
            }

            if (button) {
                button.setAttribute(
                    "aria-label",
                    "Hide password"
                );

                button.setAttribute(
                    "title",
                    "Hide password"
                );
            }

        } else {

            password.type = "password";

            if (eyeOpen) {
                eyeOpen.style.display = "inline";
            }

            if (eyeClosed) {
                eyeClosed.style.display = "none";
            }

            if (button) {
                button.setAttribute(
                    "aria-label",
                    "Show password"
                );

                button.setAttribute(
                    "title",
                    "Show password"
                );
            }

        }

    }


    document.addEventListener("DOMContentLoaded", function () {

        const button =
            document.getElementById("toggleLoginPassword");

        if (button) {

            button.addEventListener(
                "click",
                toggleTeamPassword
            );

        }

    });

</script>


<!-- =====================================================
     IMPORTANT:
     DO NOT LOAD js/auth.js HERE
===================================================== -->

<script
    type="module"
    src="js/admin-auth.js">
</script>

</body>
</html>
