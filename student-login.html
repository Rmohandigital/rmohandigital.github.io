<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | R Mohan Digital</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #020617, #0f172a, #020617);
            color: white;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #2563eb;
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.35);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #020617;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #2563eb, #06b6d4);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 18px rgba(6, 182, 212, 0.4);
        }

        #message {
            text-align: center;
            margin-top: 18px;
            color: #f87171;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
        }

        .register a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">R Mohan Digital</div>

    <div class="subtitle">
        Student Login
    </div>

    <form id="loginForm">

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="register">
        New student?
        <a href="registration.html">Register Now</a>
    </div>

</div>


<!-- Firebase -->
<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {
        apiKey: "AIzaSyDarA4FEnJ0Sg7cDxf8uPglDmrfZ6lgJ9I",
        authDomain: "r-mohan-digital-e4e4b.firebaseapp.com",
        projectId: "r-mohan-digital-e4e4b",
        storageBucket: "r-mohan-digital-e4e4b.firebasestorage.app",
        messagingSenderId: "56539770062",
        appId: "1:56539770062:web:0c815083264f74a189349f"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    document
        .getElementById("loginForm")
        .addEventListener("submit", async (event) => {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            message.style.color = "#fbbf24";
            message.textContent = "Logging in...";


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                message.style.color = "#4ade80";
                message.textContent = "Login successful!";

                setTimeout(() => {
                    window.location.href =
                        "student-dashboard.html";
                }, 800);

            } catch (error) {

                console.error(error);

                message.style.color = "#f87171";

                if (error.code === "auth/invalid-credential") {

                    message.textContent =
                        "Incorrect email or password.";

                } else if (error.code === "auth/user-not-found") {

                    message.textContent =
                        "Student account not found.";

                } else if (error.code === "auth/wrong-password") {

                    message.textContent =
                        "Incorrect password.";

                } else {

                    message.textContent =
                        "Login failed. Please try again.";
                }
            }

        });

</script>

</body>
</html>
