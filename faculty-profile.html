<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Faculty Profile | R Mohan Digital</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at top left,
            #102a43 0%,
            #07111f 40%,
            #020617 80%
        );
    color:white;
    padding:30px;
}

/* TOP */

.topbar{
    max-width:1100px;
    margin:0 auto 25px auto;

    padding:18px 22px;

    border-radius:15px;

    background:rgba(7,17,31,.85);

    border:
        1px solid
        rgba(0,229,255,.2);

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.topbar h1{
    font-size:22px;
}

.topbar h1 span{
    color:#00e5ff;
}

.back-btn{
    padding:10px 15px;

    border:
        1px solid
        #00e5ff;

    border-radius:8px;

    background:
        rgba(0,229,255,.08);

    color:#00e5ff;

    cursor:pointer;

    font-weight:bold;
}

.back-btn:hover{
    background:#00e5ff;
    color:#020617;
}

/* PROFILE */

.profile-container{
    max-width:1100px;
    margin:auto;
}

.profile-header{
    padding:30px;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(0,229,255,.10),
            rgba(37,99,235,.05)
        );

    border:
        1px solid
        rgba(0,229,255,.2);

    margin-bottom:20px;

    display:flex;

    align-items:center;

    gap:25px;
}

.avatar{
    width:90px;
    height:90px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:38px;

    background:
        rgba(0,229,255,.08);

    border:
        2px solid
        #00e5ff;

    box-shadow:
        0 0 25px
        rgba(0,229,255,.2);
}

.profile-header h2{
    color:#00e5ff;
    font-size:28px;
    margin-bottom:8px;
}

.profile-header p{
    color:#94a3b8;
    font-size:14px;
}

/* GRID */

.profile-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:20px;
}

.card{
    padding:25px;

    border-radius:15px;

    background:
        rgba(7,17,31,.85);

    border:
        1px solid
        rgba(0,229,255,.15);
}

.card h3{
    color:#00e5ff;

    margin-bottom:20px;

    font-size:17px;
}

.info{
    margin-bottom:17px;
}

.info label{
    display:block;

    color:#64748b;

    font-size:11px;

    text-transform:uppercase;

    margin-bottom:5px;
}

.info strong{
    color:#e2e8f0;

    font-size:14px;

    word-break:break-word;
}

/* STATUS */

.status{
    display:inline-block;

    padding:7px 13px;

    border-radius:20px;

    font-size:11px;

    font-weight:bold;
}

.status.active{
    color:#22c55e;

    background:
        rgba(34,197,94,.08);

    border:
        1px solid
        rgba(34,197,94,.3);
}

.status.pending{
    color:#facc15;

    background:
        rgba(250,204,21,.08);

    border:
        1px solid
        rgba(250,204,21,.3);
}

.status.rejected{
    color:#f87171;

    background:
        rgba(239,68,68,.08);

    border:
        1px solid
        rgba(239,68,68,.3);
}

/* LOADING */

#loading{
    max-width:600px;

    margin:100px auto;

    text-align:center;

    color:#00e5ff;

    font-size:18px;
}

/* ERROR */

#errorBox{
    display:none;

    max-width:600px;

    margin:100px auto;

    padding:30px;

    text-align:center;

    border-radius:15px;

    background:
        rgba(239,68,68,.08);

    border:
        1px solid
        rgba(239,68,68,.3);
}

#errorBox h2{
    color:#f87171;

    margin-bottom:12px;
}

#errorBox p{
    color:#94a3b8;

    margin-bottom:20px;
}

@media(max-width:700px){

    body{
        padding:15px;
    }

    .topbar{
        flex-direction:column;

        gap:15px;

        align-items:flex-start;
    }

    .profile-header{
        flex-direction:column;

        text-align:center;
    }

    .profile-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>


<!-- TOPBAR -->

<div class="topbar">

    <h1>
        Faculty <span>Profile</span>
    </h1>

    <button
        class="back-btn"
        onclick="goBack()">

        ← Back to Mentor

    </button>

</div>


<!-- LOADING -->

<div id="loading">

    ⏳ Loading faculty profile...

</div>


<!-- ERROR -->

<div id="errorBox">

    <h2>
        Faculty Profile Not Found
    </h2>

    <p id="errorMessage">
        Unable to load this faculty profile.
    </p>

    <button
        class="back-btn"
        onclick="goBack()">

        ← Back to Mentor Dashboard

    </button>

</div>


<!-- PROFILE -->

<div
    class="profile-container"
    id="profileContainer"
    style="display:none;">


    <!-- HEADER -->

    <div class="profile-header">

        <div class="avatar">
            👨‍🏫
        </div>

        <div>

            <h2 id="facultyName">
                Faculty
            </h2>

            <p id="facultyEmail">
                Loading...
            </p>

        </div>

    </div>


    <!-- INFORMATION -->

    <div class="profile-grid">


        <!-- PERSONAL -->

        <div class="card">

            <h3>
                👤 Personal Information
            </h3>


            <div class="info">

                <label>
                    Full Name
                </label>

                <strong id="name">
                    -
                </strong>

            </div>


            <div class="info">

                <label>
                    Email
                </label>

                <strong id="email">
                    -
                </strong>

            </div>


            <div class="info">

                <label>
                    Phone
                </label>

                <strong id="phone">
                    -
                </strong>

            </div>

        </div>


        <!-- FACULTY -->

        <div class="card">

            <h3>
                👨‍🏫 Faculty Information
            </h3>


            <div class="info">

                <label>
                    Course
                </label>

                <strong id="course">
                    -
                </strong>

            </div>


            <div class="info">

                <label>
                    Role
                </label>

                <strong id="role">
                    -
                </strong>

            </div>


            <div class="info">

                <label>
                    Account Status
                </label>

                <span
                    id="status"
                    class="status">

                    -

                </span>

            </div>

        </div>


        <!-- ACCOUNT -->

        <div class="card">

            <h3>
                🔐 Account Information
            </h3>


            <div class="info">

                <label>
                    Firebase User ID
                </label>

                <strong id="uid">
                    -
                </strong>

            </div>


            <div class="info">

                <label>
                    Approved By
                </label>

                <strong id="approvedBy">
                    -
                </strong>

            </div>


            <div class="info">

                <label>
                    Account Created
                </label>

                <strong id="createdAt">
                    -
                </strong>

            </div>

        </div>


        <!-- MANAGEMENT -->

        <div class="card">

            <h3>
                📚 Faculty Management
            </h3>


            <div class="info">

                <label>
                    Faculty ID
                </label>

                <strong id="facultyId">
                    -
                </strong>

            </div>


            <div class="info">

                <label>
                    Department / Course
                </label>

                <strong id="department">
                    -
                </strong>

            </div>

        </div>

    </div>

</div>


<script type="module">

import {
    auth,
    db
} from "./firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* ELEMENTS */

const loading =
    document.getElementById(
        "loading"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const profileContainer =
    document.getElementById(
        "profileContainer"
    );


/*
==================================================
GET FACULTY ID FROM URL
==================================================

Example URL:

faculty-profile.html?id=abc123

We get:

abc123
*/

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const facultyId =
    urlParams.get("id");


console.log(
    "Faculty ID from URL:",
    facultyId
);


/* BACK */

window.goBack =
    function(){

        window.location.href =
            "mentor-dashboard.html";

    };


/* NO ID */

if(!facultyId){

    showError(
        "No faculty ID was provided in the URL."
    );

}


/* AUTH */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            showError(
                "You are not logged in."
            );

            return;
        }


        if(!facultyId){

            return;
        }


        try{

            /*
            IMPORTANT:

            We are directly reading:

            users/{facultyId}

            */

            const facultyRef =
                doc(
                    db,
                    "users",
                    facultyId
                );


            const snapshot =
                await getDoc(
                    facultyRef
                );


            console.log(
                "Faculty document exists:",
                snapshot.exists()
            );


            console.log(
                "Faculty document:",
                snapshot.data()
            );


            if(!snapshot.exists()){

                showError(
                    "No users document exists for this Firebase ID: " +
                    facultyId
                );

                return;
            }


            const data =
                snapshot.data();


            /*
            Make sure this is actually
            a faculty account.
            */

            if(
                data.role !== "faculty" &&
                data.role !== "Faculty"
            ){

                showError(
                    "This Firebase account is not a faculty account."
                );

                return;
            }


            /* SHOW PROFILE */

            document.getElementById(
                "facultyName"
            ).textContent =
                data.name ||
                "Faculty";


            document.getElementById(
                "facultyEmail"
            ).textContent =
                data.email ||
                user.email ||
                "";


            document.getElementById(
                "name"
            ).textContent =
                data.name ||
                "Not provided";


            document.getElementById(
                "email"
            ).textContent =
                data.email ||
                user.email ||
                "Not provided";


            document.getElementById(
                "phone"
            ).textContent =
                data.phone ||
                "Not provided";


            document.getElementById(
                "course"
            ).textContent =
                data.course ||
                "Not assigned";


            document.getElementById(
                "department"
            ).textContent =
                data.course ||
                "Not assigned";


            document.getElementById(
                "role"
            ).textContent =
                data.role ||
                "faculty";


            document.getElementById(
                "uid"
            ).textContent =
                facultyId;


            document.getElementById(
                "facultyId"
            ).textContent =
                facultyId;


            document.getElementById(
                "approvedBy"
            ).textContent =
                data.approvedBy ||
                "Not available";


            /* STATUS */

            const statusElement =
                document.getElementById(
                    "status"
                );


            const status =
                data.status ||
                "Unknown";


            statusElement.textContent =
                status.toUpperCase();


            statusElement.className =
                "status";


            if(
                status.toLowerCase()
                === "active"
            ){

                statusElement.classList.add(
                    "active"
                );

            }

            else if(
                status.toLowerCase()
                === "pending"
            ){

                statusElement.classList.add(
                    "pending"
                );

            }

            else if(
                status.toLowerCase()
                === "rejected"
            ){

                statusElement.classList.add(
                    "rejected"
                );

            }


            /* CREATED DATE */

            if(
                data.createdAt &&
                data.createdAt.toDate
            ){

                document.getElementById(
                    "createdAt"
                ).textContent =
                    data.createdAt
                        .toDate()
                        .toLocaleString();

            }

            else{

                document.getElementById(
                    "createdAt"
                ).textContent =
                    "Not available";

            }


            /* SHOW */

            loading.style.display =
                "none";


            profileContainer.style.display =
                "block";


        }

        catch(error){

            console.error(
                "Faculty profile error:",
                error
            );


            showError(
                "Firebase error: " +
                error.message
            );

        }

    }
);


/* ERROR FUNCTION */

function showError(
    message
){

    loading.style.display =
        "none";

    profileContainer.style.display =
        "none";

    errorBox.style.display =
        "block";

    errorMessage.textContent =
        message;

    console.error(
        message
    );

}

</script>

</body>

</html>
