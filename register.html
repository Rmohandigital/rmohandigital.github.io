<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | R Mohan Digital</title>

    <link rel="stylesheet" href="style.css">

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2563EB, #0F172A);
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* MAIN CONTAINER */

        .register-container {
            width: 100%;
            max-width: 1050px;
            margin: auto;

            background: #fff;
            border-radius: 20px;
            padding: 30px;

            box-shadow: 0 15px 40px rgba(0,0,0,.35);

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        /* LEFT SIDE */

        .registration-details {
            padding: 15px;
        }

        .registration-details h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2563EB;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px;

            border: 1px solid #ccc;
            border-radius: 10px;

            font-size: 16px;
            outline: none;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #2563EB;
            box-shadow: 0 0 5px rgba(37,99,235,.25);
        }

        /* REGISTER BUTTON */

        #registerBtn {
            width: 100%;
            padding: 14px;

            border: none;
            background: #2563EB;
            color: white;

            font-size: 17px;
            border-radius: 10px;

            cursor: pointer;
            margin-top: 5px;
        }

        #registerBtn:hover {
            background: #0F172A;
        }

        /* LOGIN */

        .login-link {
            margin-top: 20px;
            text-align: center;
            font-size: 15px;
        }

        .login-link a {
            color: #2563EB;
            text-decoration: none;
            font-weight: bold;
        }

        /* RIGHT PAYMENT SIDE */

        .payment-box {
            background: #111;

            color: white;

            padding: 30px 25px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 0 25px cyan;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .payment-box h3 {
            color: #2870ff;
            font-size: 25px;
            margin-bottom: 15px;
        }

        .payment-box p {
            margin: 6px 0;
            font-size: 17px;
        }

        /* PAY BUTTON */

        .pay-btn {
            display: inline-block;

            margin-top: 20px;

            background: #2563EB;
            color: white;

            text-decoration: none;

            border-radius: 40px;

            padding: 14px 35px;

            font-size: 18px;
            font-weight: bold;

            transition: .2s;
        }

        .pay-btn:hover {
            background: #1d4ed8;
            transform: scale(1.03);
        }

        /* QR TITLE */

        .qr-title {
            color: #2870ff;
            font-size: 22px;

            margin-top: 30px;
            margin-bottom: 12px;
        }

        /* QR CONTAINER */

        #qrcode {
            width: 240px;
            height: 240px;

            background: white;

            padding: 10px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 25px;
        }

        #qrcode img {
            width: 220px !important;
            height: 220px !important;
        }

        /* SCREENSHOT */

        .upload-title {
            display: block;

            font-weight: bold;

            margin-top: 5px;
            margin-bottom: 10px;
        }

        #paymentScreenshot {
            width: 100%;

            max-width: 350px;

            padding: 10px;

            background: white;

            color: black;

            border-radius: 8px;

            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            body {
                padding: 20px 10px;
            }

            .register-container {
                grid-template-columns: 1fr;

                padding: 15px;

                gap: 20px;
            }

            .registration-details {
                padding: 10px;
            }

            .registration-details h2 {
                font-size: 25px;
            }

            .payment-box {
                padding: 25px 15px;
            }

            #qrcode {
                width: 230px;
                height: 230px;
            }

            #qrcode img {
                width: 210px !important;
                height: 210px !important;
            }
        }
    </style>
</head>


<body>


<!-- ================================================= -->
<!-- MAIN REGISTRATION CONTAINER -->
<!-- ================================================= -->

<div class="register-container">


    <!-- ================================================= -->
    <!-- LEFT: REGISTRATION DETAILS -->
    <!-- ================================================= -->

    <div class="registration-details">

        <h2>Student Registration</h2>


        <!-- NAME -->

        <div class="input-group">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
            >

        </div>


        <!-- EMAIL -->

        <div class="input-group">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
            >

        </div>


        <!-- PASSWORD -->
<div class="password-wrapper">
    <input
        type="password"
        id="password"
        name="password"
        placeholder="Create New Password"
        required
    >

    <button
        type="button"
        class="password-toggle"
        onclick="togglePassword()"
    >👁</button>
</div>

        <!-- PHONE -->

        <div class="input-group">

            <input
                type="text"
                id="phone"
                placeholder="Phone Number"
            >

        </div>


        <!-- COURSE -->

        <div class="input-group">

            <select id="course">

                <option value="">
                    Select Course
                </option>

                <option>
                    Programming
                </option>

                <option>
                    Web Development
                </option>

                <option>
                    AI Learning
                </option>

                <option>
                    Digital Marketing
                </option>

                <option>
                    Trading
                </option>

            </select>

        </div>


        <!-- REGISTER -->

        <button id="registerBtn">
            Register
        </button>


        <!-- LOGIN -->

        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- RIGHT: PAYMENT GATEWAY -->
    <!-- ================================================= -->

    <div class="payment-box">


        <h3>
            Registration Fee: ₹50
        </h3>


        <p>
            Pay using UPI
        </p>


        <p>
            <b>Amount: ₹50</b>
        </p>


        <!-- MOBILE UPI BUTTON -->

        <a
            href="upi://pay?pa=9705211396@ibl&pn=R%20Mohan%20Digital&am=50&cu=INR"
            class="pay-btn"
        >
            💳 Pay ₹50 Now
        </a>


        <!-- QR -->

        <h2 class="qr-title">
            Scan & Pay ₹50
        </h2>


        <div id="qrcode"></div>


        <!-- SCREENSHOT -->

        <label
            class="upload-title"
            for="paymentScreenshot"
        >
            Upload Payment Screenshot
        </label>


        <input
            type="file"
            id="paymentScreenshot"
            accept="image/png,image/jpeg,image/jpg"
        >


    </div>


</div>


<!-- ================================================= -->
<!-- YOUR EXISTING REGISTRATION JAVASCRIPT -->
<!-- ================================================= -->

<script type="module" src="js/register.js"></script>


<!-- ================================================= -->
<!-- AUTOMATIC QR GENERATION -->
<!-- ================================================= -->

<script>

    const upiID = "9705211396@ibl";

    const upiPaymentURL =
        "upi://pay?pa=" +
        encodeURIComponent(upiID) +
        "&pn=" +
        encodeURIComponent("R Mohan Digital") +
        "&am=50" +
        "&cu=INR";


    window.addEventListener("load", function () {

        const qrContainer =
            document.getElementById("qrcode");

        if (qrContainer) {

            new QRCode(qrContainer, {

                text: upiPaymentURL,

                width: 220,

                height: 220,

                correctLevel:
                    QRCode.CorrectLevel.M

            });

        }

    });

</script>


</body>
</html>
