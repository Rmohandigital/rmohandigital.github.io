<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Faculty Profile | R Mohan Digital</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top left,
            #102a43 0%,
            #07111f 40%,
            #020617 80%
        );

    color: white;

    padding: 30px;
}


/* ===============================
   CONTAINER
================================ */

.container {

    max-width: 900px;

    margin: auto;
}


/* ===============================
   TOPBAR
================================ */

.topbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 18px 22px;

    margin-bottom: 25px;

    border-radius: 15px;

    background:
        rgba(7,17,31,0.85);

    border:
        1px solid
        rgba(0,229,255,0.2);
}


.logo {

    display: flex;

    align-items: center;

    gap: 12px;
}


.logo-circle {

    width: 45px;
    height: 45px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 2px solid #00e5ff;

    color: #00e5ff;

    font-weight: bold;

    box-shadow:
        0 0 15px
        rgba(0,229,255,0.35);
}


.logo-text h2 {

    font-size: 17px;
}


.logo-text p {

    color: #38bdf8;

    font-size: 9px;

    letter-spacing: 2px;

    margin-top: 3px;
}


/* ===============================
   BACK BUTTON
================================ */

.back-btn {

    padding: 9px 15px;

    border:
        1px solid #00e5ff;

    border-radius: 8px;

    background:
        rgba(0,229,255,0.08);

    color: #00e5ff;

    cursor: pointer;

    font-weight: bold;
}


.back-btn:hover {

    background: #00e5ff;

    color: #020617;
}


/* ===============================
   PROFILE
================================ */

.profile-card {

    background:
        rgba(7,17,31,0.88);

    border:
        1px solid
        rgba(0,229,255,0.2);

    border-radius: 18px;

    padding: 35px;

    box-shadow:
        0 0 35px
        rgba(0,229,255,0.08);
}


/* ===============================
   PROFILE HEADER
================================ */

.profile-header {

    display: flex;

    align-items: center;

    gap: 25px;

    padding-bottom: 30px;

    border-bottom:
        1px solid
        rgba(148,163,184,0.12);
}


.avatar {

    width: 90px;
    height: 90px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,229,255,0.08);

    border:
        2px solid #00e5ff;

    font-size: 38px;

    box-shadow:
        0 0 25px
        rgba(0,229,255,0.2);
}


.profile-title h1 {

    font-size: 27px;

    color: #00e5ff;

    margin-bottom: 7px;
}


.profile-title p {

    color: #64748b;

    font-size: 13px;
}


/* ===============================
   STATUS
================================ */

.status {

    display: inline-block;

    margin-top: 12px;

    padding: 6px 12px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: bold;

    color: #22c55e;

    background:
        rgba(34,197,94,0.08);

    border:
        1px solid
        rgba(34,197,94,0.3);
}


/* ===============================
   DETAILS
================================ */

.details {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;

    margin-top: 30px;
}


.detail {

    padding: 20px;

    border-radius: 12px;

    background:
        rgba(15,23,42,0.75);

    border:
        1px solid
        rgba(148,163,184,0.1);
}


.detail label {

    display: block;

    color: #64748b;

    font-size: 11px;

    margin-bottom: 8px;
}


.detail strong {

    color: #e2e8f0;

    font-size: 14px;

    word-break: break-word;
}


/* ===============================
   LOADING
================================ */

.loading {

    text-align: center;

    padding: 80px 20px;

    color: #38bdf8;
}


/* ===============================
   ERROR
================================ */

.error {

    text-align: center;

    padding: 50px;

    color: #f87171;
}


/* ===============================
   RESPONSIVE
================================ */

@media(max-width:650px) {

    body {
        padding: 15px;
    }

    .profile-card {
        padding: 22px;
    }

    .profile-header {
        flex-direction: column;
        text-align: center;
    }

    .details {
        grid-template-columns: 1fr;
    }

    .topbar {
        gap: 15px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- TOPBAR -->

    <div class="topbar">

        <div class="logo">

            <div class="logo-circle">
                RM
            </div>

            <div class="logo-text">

                <h2>
                    R Mohan Digital
                </h2>

                <p>
                    FACULTY PROFILE
                </p>

            </div>

        </div>


        <button
            class="back-btn"
            onclick="goBack()">

            ← Back

        </button>

    </div>


    <!-- PROFILE -->

    <div
        class="profile-card"
        id="profileCard">

        <div class="loading">

            Loading faculty profile...

        </div>

    </div>


</div>


<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    db
} from "./firebase.js";


import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


// ==========================================
// GET UID FROM URL
// ==========================================

const params =
    new URLSearchParams(
        window.location.search
    );


const uid =
    params.get("uid");


const profileCard =
    document.getElementById(
        "profileCard"
    );


// ==========================================
// CHECK UID
// ==========================================

if (!uid) {

    profileCard.innerHTML = `

        <div class="error">

            ❌ Faculty profile ID not found.

        </div>

    `;

} else {

    loadFacultyProfile();

}


// ==========================================
// LOAD PROFILE
// ==========================================

async function loadFacultyProfile() {

    try {

        const facultyRef =
            doc(
                db,
                "users",
                uid
            );


        const snapshot =
            await getDoc(
                facultyRef
            );


        if (!snapshot.exists()) {

            profileCard.innerHTML = `

                <div class="error">

                    ❌ Faculty profile not found.

                </div>

            `;

            return;

        }


        const data =
            snapshot.data();


        // ==================================
        // SECURITY
        // ==================================

        if (
            data.role !== "faculty" &&
            data.role !== "Faculty"
        ) {

            profileCard.innerHTML = `

                <div class="error">

                    ❌ This account is not a faculty account.

                </div>

            `;

            return;

        }


        const name =
            data.name ||
            "Faculty";


        const email =
            data.email ||
            "Not available";


        const course =
            data.course ||
            "Not assigned";


        const status =
            data.status ||
            "Unknown";


        const phone =
            data.phone ||
            "Not available";


        const joined =
            data.createdAt
                ? formatDate(data.createdAt)
                : "Not available";


        // ==================================
        // DISPLAY
        // ==================================

        profileCard.innerHTML = `

            <div class="profile-header">

                <div class="avatar">

                    👨‍🏫

                </div>


                <div class="profile-title">

                    <h1>
                        ${escapeHTML(name)}
                    </h1>

                    <p>
                        R Mohan Digital Teaching Faculty
                    </p>

                    <span class="status">

                        ${escapeHTML(
                            String(status).toUpperCase()
                        )}

                    </span>

                </div>

            </div>


            <div class="details">


                <div class="detail">

                    <label>
                        FULL NAME
                    </label>

                    <strong>
                        ${escapeHTML(name)}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        EMAIL ADDRESS
                    </label>

                    <strong>
                        ${escapeHTML(email)}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        PHONE
                    </label>

                    <strong>
                        ${escapeHTML(phone)}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        COURSE
                    </label>

                    <strong>
                        ${escapeHTML(course)}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        ACCOUNT STATUS
                    </label>

                    <strong>
                        ${escapeHTML(status)}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        JOINED
                    </label>

                    <strong>
                        ${escapeHTML(joined)}
                    </strong>

                </div>


            </div>

        `;

    }

    catch(error) {

        console.error(
            "Faculty profile error:",
            error
        );


        profileCard.innerHTML = `

            <div class="error">

                ❌ Unable to load faculty profile.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


// ==========================================
// DATE
// ==========================================

function formatDate(timestamp) {

    try {

        if (
            timestamp &&
            typeof timestamp.toDate ===
            "function"
        ) {

            return timestamp
                .toDate()
                .toLocaleDateString(
                    "en-IN",
                    {
                        day: "2-digit",
                        month: "short",
                        year: "numeric"
                    }
                );

        }

        return "Not available";

    }

    catch {

        return "Not available";

    }

}


// ==========================================
// SECURITY
// ==========================================

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


// ==========================================
// BACK
// ==========================================

window.goBack = function() {

    window.location.href =
        "mentor-dashboard.html";

};


</script>


</body>

</html>
