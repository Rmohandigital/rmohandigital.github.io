<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | R Mohan Digital</title>

    <link rel="stylesheet" href="style.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:linear-gradient(135deg,#2563EB,#0F172A);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .register-box{
            width:420px;
            background:#fff;
            padding:35px;
            border-radius:15px;
            box-shadow:0 15px 35px rgba(0,0,0,.3);
        }

        .register-box h2{
            text-align:center;
            margin-bottom:25px;
            color:#2563EB;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group input,
        .input-group select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:13px;
            border:none;
            background:#2563EB;
            color:#fff;
            font-size:17px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#0F172A;
        }

        .login-link{
            margin-top:18px;
            text-align:center;
        }

        .login-link a{
            color:#2563EB;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="register-box">

    <h2>Student Registration</h2>

    <div class="input-group">
        <input type="text" id="name" placeholder="Full Name">
    </div>

    <div class="input-group">
        <input type="email" id="email" placeholder="Email Address">
    </div>

    <div class="input-group">
        <input type="password" id="password" placeholder="create your Password">
    </div>

    <div class="input-group">
        <input type="text" id="phone" placeholder="Phone Number">
    </div>

    <div class="input-group">
        <select id="course">
            <option value="">Select Course</option>
            <option>Programming</option>
            <option>Web Development</option>
            <option>AI Learning</option>
            <option>Digital Marketing</option>
            <option>Trading</option>
        </select>
    </div>

    <!-- Payment Section -->

<div class="payment-box">

    <h3>Registration Fee: ₹50</h3>

    <p>Pay using UPI</p>

    <p><b>Amount:</b> ₹50</p>

    <a 
    href="upi://pay?pa=9705211396@fam&pn=R%20Mohan%20Digital&am=50&cu=INR"
    class="pay-btn">

        💳 Pay ₹50 Now

    </a>

    <div class="input-group">
    <label>Upload Payment Screenshot</label><br><br>
    <input type="file" id="paymentScreenshot" accept="image/*">
</div>
    <div class="qr-box">
    <h2>Scan & Pay ₹50</h2>
    <img src="images/qr.png" alt="Payment QR Code">
    <p>Scan this QR code to pay</p>
</div>

<!-- QR Code Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<div class="payment-box">
    <h2>Registration Fee: ₹50</h2>
    <p><strong>Pay using UPI</strong></p>
    <p>Amount: ₹50</p>

    <a href="upi://pay?pa=9705211396@ibl&pn=R%20Mohan%20Digital&am=50&cu=INR">
        <button class="pay-btn">💳 Pay ₹50 Now</button>
    </a>

    <br><br>

    <label><strong>Upload Payment Screenshot</strong></label><br>
    <input type="file" accept="image/*">

    <br><br>

    <h2>Scan & Pay ₹50</h2>
    <div id="qrcode"></div>
</div>

<script>
new QRCode(document.getElementById("qrcode"), {
    text: "upi://pay?pa=9705211396@ibl&pn=R%20Mohan%20Digital&am=50&cu=INR",
    width: 220,
    height: 220
});
</script>

<style>
.payment-box{
    background:#111;
    color:#fff;
    padding:25px;
    border-radius:20px;
    text-align:center;
    max-width:400px;
    margin:20px auto;
    box-shadow:0 0 20px cyan;
}
.pay-btn{
    background:#2563eb;
    color:#fff;
    border:none;
    padding:15px 30px;
    font-size:18px;
    border-radius:50px;
    cursor:pointer;
}
#qrcode{
    display:flex;
    justify-content:center;
    margin-top:20px;
}
</style>

</div>

    <button id="registerBtn">
        Register
    </button>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script type="module" src="js/register.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</body>
</html>
