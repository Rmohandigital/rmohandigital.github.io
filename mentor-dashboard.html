<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mentor Dashboard | R Mohan Digital</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #0f172a;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.2);
        }

        header h2 {
            color: #38bdf8;
        }

        #mentorName {
            font-size: 14px;
            margin-top: 4px;
            color: #cbd5e1;
        }

        .logout-btn {
            background: #ef4444;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-bottom: 8px;
            color: #0f172a;
        }

        .welcome p {
            color: #64748b;
        }

        .section-title {
            margin-bottom: 15px;
        }

        .faculty-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .faculty-card {
            background: white;
            border-radius: 15px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .faculty-card h3 {
            color: #0f172a;
            margin-bottom: 10px;
        }

        .faculty-card p {
            color: #475569;
            margin: 7px 0;
            font-size: 14px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .accept-btn,
        .reject-btn {
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }

        .accept-btn {
            background: #16a34a;
            color: white;
        }

        .accept-btn:hover {
            background: #15803d;
        }

        .reject-btn {
            background: #dc2626;
            color: white;
        }

        .reject-btn:hover {
            background: #b91c1c;
        }

        .message {
            text-align: center;
            padding: 30px;
            color: #64748b;
            background: white;
            border-radius: 15px;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

    </style>

</head>


<body>


<header>

    <div>

        <h2>R Mohan Digital</h2>

        <div id="mentorName">
            Mentor Dashboard
        </div>

    </div>


    <button
        class="logout-btn"
        id="logoutBtn">

        Logout

    </button>

</header>



<div class="container">


    <div class="welcome">

        <h1>Mentor Dashboard</h1>

        <p>
            Manage faculty registration requests
            and approve or reject faculty members.
        </p>

    </div>


    <h2 class="section-title">
        Faculty Requests
    </h2>


    <div
        id="facultyList"
        class="faculty-list">

        <div class="loading">
            Loading faculty requests...
        </div>

    </div>


</div>



<script type="module"
        src="js/mentor-dashboard.js">
</script>


</body>

</html>
