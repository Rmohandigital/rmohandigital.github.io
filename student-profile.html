<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Profile | R Mohan Digital</title>


    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                #e5e7eb;

            color:
                #1e3a8a;

            padding:
                25px;
        }


        .container {

            width: 100%;

            max-width:
                1150px;

            margin:
                auto;
        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .topbar {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                15px;

            margin-bottom:
                22px;

            padding:
                18px 22px;

            background:
                #ffffff;

            border:
                1px solid #cbd5e1;

            border-radius:
                14px;

            box-shadow:
                0 5px 20px
                rgba(15, 23, 42, 0.08);
        }


        .topbar h1 {

            font-size:
                22px;

            color:
                #1e40af;
        }


        .topbar h1 span {

            color:
                #2563eb;
        }


        .back-btn {

            padding:
                10px 16px;

            border:
                1px solid #2563eb;

            border-radius:
                8px;

            background:
                #eff6ff;

            color:
                #1d4ed8;

            cursor:
                pointer;

            font-weight:
                bold;

            transition:
                0.2s;
        }


        .back-btn:hover {

            background:
                #2563eb;

            color:
                white;
        }


        /* =====================================================
           PROFILE HEADER
        ===================================================== */

        .profile-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                20px;

            padding:
                28px;

            margin-bottom:
                20px;

            background:
                #ffffff;

            border:
                1px solid #cbd5e1;

            border-radius:
                16px;

            box-shadow:
                0 6px 25px
                rgba(15, 23, 42, 0.08);
        }


        .profile-left {

            display:
                flex;

            align-items:
                center;

            gap:
                22px;
        }


        /* =====================================================
           AVATAR
        ===================================================== */

        .avatar {

            width:
                105px;

            height:
                105px;

            flex-shrink:
                0;

            border-radius:
                50%;

            overflow:
                hidden;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                #eff6ff;

            border:
                4px solid #2563eb;

            color:
                #2563eb;

            font-size:
                42px;

            box-shadow:
                0 5px 18px
                rgba(37, 99, 235, 0.20);
        }


        .avatar img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;
        }


        .profile-info h2 {

            color:
                #1e40af;

            font-size:
                27px;

            margin-bottom:
                8px;
        }


        .profile-info p {

            color:
                #475569;

            font-size:
                13px;

            margin:
                5px 0;
        }


        .active-badge {

            display:
                inline-block;

            margin-top:
                7px;

            padding:
                5px 11px;

            border-radius:
                20px;

            color:
                #15803d;

            background:
                #f0fdf4;

            border:
                1px solid #bbf7d0;

            font-size:
                10px;

            font-weight:
                bold;
        }


        /* =====================================================
           STUDENT ID BADGE
        ===================================================== */

        .student-id-box {

            margin-top:
                10px;

            display:
                inline-block;

            padding:
                7px 12px;

            border-radius:
                7px;

            background:
                #eff6ff;

            border:
                1px solid #bfdbfe;

            color:
                #1d4ed8;

            font-size:
                12px;

            font-weight:
                bold;
        }


        /* =====================================================
           STATS
        ===================================================== */

        .stats-grid {

            display:
                grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap:
                15px;

            margin-bottom:
                20px;
        }


        .stat-card {

            padding:
                20px;

            background:
                #ffffff;

            border:
                1px solid #cbd5e1;

            border-radius:
                13px;

            box-shadow:
                0 5px 18px
                rgba(15, 23, 42, 0.06);
        }


        .stat-icon {

            font-size:
                25px;

            margin-bottom:
                9px;
        }


        .stat-card h3 {

            color:
                #2563eb;

            font-size:
                25px;
        }


        .stat-card p {

            color:
                #64748b;

            font-size:
                11px;

            margin-top:
                5px;
        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .content-grid {

            display:
                grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:
                20px;
        }


        .card {

            padding:
                22px;

            background:
                #ffffff;

            border:
                1px solid #cbd5e1;

            border-radius:
                15px;

            box-shadow:
                0 5px 20px
                rgba(15, 23, 42, 0.06);
        }


        .card.full {

            grid-column:
                1 / -1;
        }


        .card h2 {

            color:
                #1e40af;

            font-size:
                18px;

            margin-bottom:
                18px;

            padding-bottom:
                10px;

            border-bottom:
                1px solid #e2e8f0;
        }


        /* =====================================================
           DETAILS
        ===================================================== */

        .details-grid {

            display:
                grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:
                12px;
        }


        .detail {

            padding:
                14px;

            border-radius:
                9px;

            background:
                #f8fafc;

            border:
                1px solid #e2e8f0;
        }


        .detail label {

            display:
                block;

            color:
                #64748b;

            font-size:
                10px;

            margin-bottom:
                6px;

            text-transform:
                uppercase;

            font-weight:
                bold;
        }


        .detail span {

            color:
                #1e3a8a;

            font-size:
                13px;

            word-break:
                break-word;

            font-weight:
                500;
        }


        /* =====================================================
           FACULTY
        ===================================================== */

        .faculty-box {

            padding:
                18px;

            border-radius:
                12px;

            background:
                #eff6ff;

            border:
                1px solid #bfdbfe;
        }


        .faculty-box h3 {

            color:
                #1e40af;

            font-size:
                16px;

            margin-bottom:
                8px;
        }


        .faculty-box p {

            color:
                #475569;

            font-size:
                12px;

            margin:
                6px 0;
        }


        /* =====================================================
           BIO
        ===================================================== */

        .bio {

            color:
                #475569;

            font-size:
                13px;

            line-height:
                1.8;

            white-space:
                pre-wrap;
        }


        /* =====================================================
           RECORDS
        ===================================================== */

        .record {

            padding:
                14px;

            margin-bottom:
                10px;

            border-radius:
                10px;

            background:
                #f8fafc;

            border:
                1px solid #e2e8f0;
        }


        .record-title {

            color:
                #1e40af;

            font-weight:
                bold;

            font-size:
                13px;
        }


        .record-subtitle {

            color:
                #64748b;

            font-size:
                11px;

            margin-top:
                6px;
        }


        .present {

            color:
                #16a34a;

            font-weight:
                bold;
        }


        .absent {

            color:
                #dc2626;

            font-weight:
                bold;
        }


        .marks {

            color:
                #2563eb;

            font-size:
                19px;

            font-weight:
                bold;
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty {

            padding:
                30px;

            text-align:
                center;

            color:
                #64748b;

            font-size:
                12px;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            min-height:
                70vh;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            color:
                #2563eb;

            font-weight:
                bold;

            text-align:
                center;
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .error {

            min-height:
                60vh;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            color:
                #dc2626;

            text-align:
                center;

            font-weight:
                bold;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 900px) {

            .stats-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }
        }


        @media (max-width: 750px) {

            .profile-header {

                flex-direction:
                    column;

                align-items:
                    flex-start;
            }


            .content-grid {

                grid-template-columns:
                    1fr;
            }


            .card.full {

                grid-column:
                    auto;
            }
        }


        @media (max-width: 550px) {

            body {

                padding:
                    12px;
            }


            .topbar {

                flex-direction:
                    column;

                align-items:
                    flex-start;
            }


            .back-btn {

                width:
                    100%;
            }


            .profile-left {

                flex-direction:
                    column;

                align-items:
                    center;

                width:
                    100%;

                text-align:
                    center;
            }


            .profile-header {

                align-items:
                    center;
            }


            .stats-grid {

                grid-template-columns:
                    1fr;
            }


            .details-grid {

                grid-template-columns:
                    1fr;
            }


            .avatar {

                width:
                    90px;

                height:
                    90px;
            }


            .profile-info h2 {

                font-size:
                    23px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="topbar">

        <h1>
            Student <span>Profile</span>
        </h1>


        <button
            class="back-btn"
            id="backBtn">

            ← Back

        </button>

    </div>


    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <div id="pageContent">

        <div class="loading">

            Loading student profile...

        </div>

    </div>


</div>


<!-- =========================================================
     FIREBASE
========================================================= -->

<script type="module">

import {
    auth,
    db
} from "./firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";



/* =========================================================
   ELEMENTS
========================================================= */

const pageContent =
    document.getElementById("pageContent");


const backBtn =
    document.getElementById("backBtn");



/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const requestedStudentId =
    params.get("id");



/* =========================================================
   DATA
========================================================= */

let studentId = null;

let studentData = null;

let currentUserData = null;

let currentUserRole = null;

let currentFaculty = null;

let attendanceRecords = [];

let marksRecords = [];



/* =========================================================
   BACK BUTTON
========================================================= */

backBtn.addEventListener(
    "click",
    () => {

        if (
            currentUserRole === "faculty"
        ) {

            window.location.href =
                "faculty-dashboard.html";

        } else {

            window.location.href =
                "student-dashboard.html";

        }

    }
);



/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            window.location.href =
                "login.html";

            return;
        }


        try {

            /* =============================================
               LOAD CURRENT USER
            ============================================= */

            const currentUserRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const currentUserSnapshot =
                await getDoc(
                    currentUserRef
                );


            if (
                !currentUserSnapshot.exists()
            ) {

                showError(
                    "Your user profile was not found."
                );

                return;
            }


            currentUserData =
                currentUserSnapshot.data();


            currentUserRole =
                String(
                    currentUserData.role || ""
                )
                .trim()
                .toLowerCase();



            /* =============================================
               DETERMINE STUDENT
            ============================================= */

            if (
                currentUserRole === "student"
            ) {

                /*
                 Student can only open
                 their own profile.
                */

                studentId =
                    user.uid;


                /*
                 If an ID was supplied in URL,
                 make sure it belongs to this student.
                */

                if (
                    requestedStudentId &&
                    requestedStudentId !== user.uid
                ) {

                    showError(
                        "You can only view your own student profile."
                    );

                    return;
                }

            }


            else if (
                currentUserRole === "faculty"
            ) {

                /*
                 Faculty must provide
                 ?id=STUDENT_UID
                */

                if (
                    !requestedStudentId
                ) {

                    showError(
                        "Student ID is missing."
                    );

                    return;
                }


                studentId =
                    requestedStudentId;

            }


            else {

                showError(
                    "You do not have permission to view student profiles."
                );

                return;
            }



            /* =============================================
               LOAD STUDENT
            ============================================= */

            const studentRef =
                doc(
                    db,
                    "users",
                    studentId
                );


            const studentSnapshot =
                await getDoc(
                    studentRef
                );


            if (
                !studentSnapshot.exists()
            ) {

                showError(
                    "Student profile not found."
                );

                return;
            }


            studentData =
                studentSnapshot.data();



            /* =============================================
               CHECK STUDENT ROLE
            ============================================= */

            const studentRole =
                String(
                    studentData.role || ""
                )
                .trim()
                .toLowerCase();


            if (
                studentRole !== "student"
            ) {

                showError(
                    "This account is not a student."
                );

                return;
            }



            /* =============================================
               FACULTY ACCESS CHECK
            ============================================= */

            if (
                currentUserRole === "faculty"
            ) {

                const assignedFaculty =
                    studentData.facultyId ||
                    studentData.assignedFaculty ||
                    studentData.assignedFacultyId;


                if (
                    assignedFaculty &&
                    assignedFaculty !== user.uid
                ) {

                    showError(
                        "This student is not assigned to you."
                    );

                    return;
                }


                await loadAssignedFaculty();

            }


            /* =============================================
               STUDENT LOADS ASSIGNED FACULTY
            ============================================= */

            else {

                await loadAssignedFaculty();

            }



            /* =============================================
               ATTENDANCE
            ============================================= */

            await loadAttendance();



            /* =============================================
               MARKS
            ============================================= */

            await loadMarks();



            /* =============================================
               RENDER
            ============================================= */

            renderPage();

        }


        catch (error) {

            console.error(
                "Student profile error:",
                error
            );


            showError(
                "Unable to load student profile."
            );

        }

    }
);



/* =========================================================
   LOAD ASSIGNED FACULTY
========================================================= */

async function loadAssignedFaculty() {

    const facultyId =
        studentData.facultyId ||
        studentData.assignedFaculty ||
        studentData.assignedFacultyId;


    if (!facultyId) {

        currentFaculty = null;

        return;
    }


    try {

        const facultyRef =
            doc(
                db,
                "users",
                facultyId
            );


        const snapshot =
            await getDoc(
                facultyRef
            );


        if (
            snapshot.exists()
        ) {

            currentFaculty =
                snapshot.data();

        }

    }

    catch (error) {

        console.error(
            "Faculty loading error:",
            error
        );

    }

}



/* =========================================================
   LOAD ATTENDANCE
========================================================= */

async function loadAttendance() {

    attendanceRecords = [];


    /*
     Only query if we know the faculty.
     This keeps the student profile usable
     even before a faculty is assigned.
    */

    const facultyId =
        studentData.facultyId ||
        studentData.assignedFaculty ||
        studentData.assignedFacultyId;


    if (!facultyId) {

        return;
    }


    try {

        const attendanceQuery =
            query(
                collection(
                    db,
                    "attendance"
                ),

                where(
                    "studentId",
                    "==",
                    studentId
                ),

                where(
                    "facultyId",
                    "==",
                    facultyId
                )
            );


        const snapshot =
            await getDocs(
                attendanceQuery
            );


        snapshot.forEach(
            item => {

                attendanceRecords.push({

                    id:
                        item.id,

                    ...item.data()

                });

            }
        );


        attendanceRecords.sort(
            (a, b) => {

                return String(
                    b.date || ""
                )
                .localeCompare(
                    String(
                        a.date || ""
                    )
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Attendance error:",
            error
        );

    }

}



/* =========================================================
   LOAD MARKS
========================================================= */

async function loadMarks() {

    marksRecords = [];


    const facultyId =
        studentData.facultyId ||
        studentData.assignedFaculty ||
        studentData.assignedFacultyId;


    if (!facultyId) {

        return;
    }


    try {

        const marksQuery =
            query(
                collection(
                    db,
                    "marks"
                ),

                where(
                    "studentId",
                    "==",
                    studentId
                ),

                where(
                    "facultyId",
                    "==",
                    facultyId
                )
            );


        const snapshot =
            await getDocs(
                marksQuery
            );


        snapshot.forEach(
            item => {

                marksRecords.push({

                    id:
                        item.id,

                    ...item.data()

                });

            }
        );

    }

    catch (error) {

        console.error(
            "Marks error:",
            error
        );

    }

}



/* =========================================================
   RENDER PAGE
========================================================= */

function renderPage() {

    const name =
        studentData.name ||
        studentData.displayName ||
        "Student";


    const email =
        studentData.email ||
        "Not available";


    const phone =
        studentData.phone ||
        studentData.mobile ||
        "Not available";


    const course =
        studentData.course ||
        studentData.courseName ||
        "Not assigned";


    const status =
        studentData.status ||
        "Active";


    const photo =
        studentData.photoURL ||
        studentData.photo ||
        "";


    const avatar =
        photo

        ? `
            <img
                src="${escapeHTML(photo)}"
                alt="Student Photo"
            >
          `

        : "🎓";



    const attendanceStats =
        calculateAttendance();


    const marksStats =
        calculateMarks();



    /* =====================================================
       PAGE
    ===================================================== */

    pageContent.innerHTML = `


        <!-- =================================================
             PROFILE HEADER
        ================================================== -->

        <div class="profile-header">


            <div class="profile-left">


                <div class="avatar">

                    ${avatar}

                </div>


                <div class="profile-info">

                    <h2>

                        ${escapeHTML(name)}

                    </h2>


                    <p>

                        📧
                        ${escapeHTML(email)}

                    </p>


                    <p>

                        📚
                        ${escapeHTML(course)}

                    </p>


                    <div class="student-id-box">

                        Student ID:
                        ${escapeHTML(
                            studentData.studentId ||
                            studentData.id ||
                            studentId
                        )}

                    </div>


                    <br>


                    <span class="active-badge">

                        ✓
                        ${escapeHTML(
                            String(status).toUpperCase()
                        )}

                    </span>

                </div>

            </div>

        </div>



        <!-- =================================================
             STATS
        ================================================== -->

        <div class="stats-grid">


            <div class="stat-card">

                <div class="stat-icon">
                    📅
                </div>

                <h3>

                    ${attendanceStats.percentage}%

                </h3>

                <p>
                    Attendance
                </p>

            </div>



            <div class="stat-card">

                <div class="stat-icon">
                    ✓
                </div>

                <h3>

                    ${attendanceStats.present}

                </h3>

                <p>
                    Present
                </p>

            </div>



            <div class="stat-card">

                <div class="stat-icon">
                    ✕
                </div>

                <h3>

                    ${attendanceStats.absent}

                </h3>

                <p>
                    Absent
                </p>

            </div>



            <div class="stat-card">

                <div class="stat-icon">
                    📝
                </div>

                <h3>

                    ${marksStats.average}%

                </h3>

                <p>
                    Marks Average
                </p>

            </div>


        </div>



        <!-- =================================================
             CONTENT
        ================================================== -->

        <div class="content-grid">



            <!-- =============================================
                 PERSONAL INFORMATION
            ============================================== -->

            <div class="card">

                <h2>
                    👤 Personal Information
                </h2>


                <div class="details-grid">


                    <div class="detail">

                        <label>
                            Full Name
                        </label>

                        <span>
                            ${escapeHTML(name)}
                        </span>

                    </div>



                    <div class="detail">

                        <label>
                            Email
                        </label>

                        <span>
                            ${escapeHTML(email)}
                        </span>

                    </div>



                    <div class="detail">

                        <label>
                            Phone
                        </label>

                        <span>
                            ${escapeHTML(phone)}
                        </span>

                    </div>



                    <div class="detail">

                        <label>
                            Date of Birth
                        </label>

                        <span>

                            ${escapeHTML(
                                studentData.dob ||
                                studentData.dateOfBirth ||
                                "Not provided"
                            )}

                        </span>

                    </div>



                    <div class="detail">

                        <label>
                            Gender
                        </label>

                        <span>

                            ${escapeHTML(
                                studentData.gender ||
                                "Not provided"
                            )}

                        </span>

                    </div>



                    <div class="detail">

                        <label>
                            Student ID
                        </label>

                        <span>

                            ${escapeHTML(
                                studentData.studentId ||
                                studentId
                            )}

                        </span>

                    </div>


                </div>

            </div>



            <!-- =============================================
                 ACADEMIC INFORMATION
            ============================================== -->

            <div class="card">

                <h2>
                    🎓 Academic Information
                </h2>


                <div class="details-grid">


                    <div class="detail">

                        <label>
                            Course
                        </label>

                        <span>

                            ${escapeHTML(course)}

                        </span>

                    </div>



                    <div class="detail">

                        <label>
                            Role
                        </label>

                        <span>

                            ${escapeHTML(
                                studentData.role ||
                                "Student"

/* =========================================================
   ATTENDANCE CALCULATION
========================================================= */

function calculateAttendance() {

    let present = 0;

    let absent = 0;


    attendanceRecords.forEach(
        record => {

            const status =
                String(
                    record.status || ""
                )
                .trim()
                .toLowerCase();


            if (
                status === "present" ||
                status === "p"
            ) {

                present++;

            }


            else if (
                status === "absent" ||
                status === "a"
            ) {

                absent++;

            }

        }
    );


    const total =
        present + absent;


    const percentage =
        total > 0

        ? (
            (present / total) * 100
        ).toFixed(1)

        : "0";


    return {

        present,

        absent,

        total,

        percentage

    };

}



/* =========================================================
   MARKS CALCULATION
========================================================= */

function calculateMarks() {

    let totalPercentage = 0;

    let count = 0;


    marksRecords.forEach(
        record => {

            const marks =
                Number(
                    record.marks || 0
                );


            const maxMarks =
                Number(
                    record.maxMarks || 0
                );


            if (
                maxMarks > 0
            ) {

                totalPercentage +=
                    (
                        marks /
                        maxMarks
                    ) * 100;


                count++;

            }

        }
    );


    const average =
        count > 0

        ? (
            totalPercentage /
            count
        ).toFixed(1)

        : "0";


    return {

        average,

        count

    };

}



/* =========================================================
   ATTENDANCE HTML
========================================================= */

function renderAttendanceHTML() {

    if (
        attendanceRecords.length === 0
    ) {

        return `

            <div class="empty">

                📅

                <br><br>

                No attendance records yet.

            </div>

        `;

    }


    const records =
        attendanceRecords.slice(
            0,
            8
        );


    return records.map(
        record => {

            const status =
                String(
                    record.status || ""
                )
                .trim()
                .toLowerCase();


            const isPresent =
                status === "present" ||
                status === "p";


            return `

                <div class="record">

                    <div class="record-title">

                        ${escapeHTML(
                            record.subject ||
                            "Subject"
                        )}

                    </div>


                    <div class="record-subtitle">

                        📅

                        ${escapeHTML(
                            record.date ||
                            "No date"
                        )}

                        &nbsp; • &nbsp;

                        <span class="${
                            isPresent
                            ? "present"
                            : "absent"
                        }">

                            ${
                                isPresent
                                ? "✓ Present"
                                : "✕ Absent"
                            }

                        </span>

                    </div>

                </div>

            `;

        }
    ).join("");

}



/* =========================================================
   MARKS HTML
========================================================= */

function renderMarksHTML() {

    if (
        marksRecords.length === 0
    ) {

        return `

            <div class="empty">

                📝

                <br><br>

                No marks records yet.

            </div>

        `;

    }


    const records =
        marksRecords.slice(
            0,
            8
        );


    return records.map(
        record => {

            const marks =
                Number(
                    record.marks || 0
                );


            const maxMarks =
                Number(
                    record.maxMarks || 100
                );


            const percentage =
                maxMarks > 0

                ? (
                    (marks / maxMarks) * 100
                ).toFixed(1)

                : "0";


            return `

                <div class="record">

                    <div class="record-title">

                        ${escapeHTML(
                            record.subject ||
                            "Subject"
                        )}

                    </div>


                    <div class="record-subtitle">

                        📝

                        ${escapeHTML(
                            record.exam ||
                            "Exam"
                        )}

                    </div>


                    <div style="
                        margin-top:10px;
                    ">

                        <span class="marks">

                            ${escapeHTML(marks)}
                            /
                            ${escapeHTML(maxMarks)}

                        </span>


                        <span style="
                            color:#64748b;
                            font-size:11px;
                            margin-left:8px;
                        ">

                            ${escapeHTML(
                                percentage
                            )}%

                        </span>

                    </div>

                </div>

            `;

        }
    ).join("");

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
