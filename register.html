<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | R Mohan Digital</title>

    <link rel="stylesheet" href="style.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:linear-gradient(135deg,#2563EB,#0F172A);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .register-box{
            width:420px;
            background:#fff;
            padding:35px;
            border-radius:15px;
            box-shadow:0 15px 35px rgba(0,0,0,.3);
        }

        .register-box h2{
            text-align:center;
            margin-bottom:25px;
            color:#2563EB;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group input,
        .input-group select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:13px;
            border:none;
            background:#2563EB;
            color:#fff;
            font-size:17px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#0F172A;
        }

        .login-link{
            margin-top:18px;
            text-align:center;
        }

        .login-link a{
            color:#2563EB;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="register-box">

    <h2>Student Registration</h2>

    <div class="input-group">
        <input type="text" id="name" placeholder="Full Name">
    </div>

    <div class="input-group">
        <input type="email" id="email" placeholder="Email Address">
    </div>

    <div class="input-group">
        <input type="password" id="password" placeholder="Password">
    </div>

    <div class="input-group">
        <input type="text" id="phone" placeholder="Phone Number">
    </div>

    <div class="input-group">
        <select id="course">
            <option value="">Select Course</option>
            <option>Programming</option>
            <option>Web Development</option>
            <option>AI Learning</option>
            <option>Digital Marketing</option>
            <option>Trading</option>
        </select>
    </div>

    <h3 style="margin:20px 0 10px;color:#2563EB;">Registration Fee: ₹50</h3>

<p><strong>UPI ID:</strong> 9705211396@fam</p>

<div class="input-group">
    <input type="text" id="transactionId" placeholder="UPI Transaction ID">
</div>

<div class="input-group">
    <label>Upload Payment Screenshot</label><br><br>
    <input type="file" id="paymentScreenshot" accept="image/*">
</div>

    <!-- Payment Section -->

<div class="payment-box">

    <h3>Registration Fee: ₹50</h3>

    <p>Pay using UPI</p>

    <p><b>Amount:</b> ₹50</p>

    <a 
    href="upi://pay?pa=9705211396@fam&pn=R%20Mohan%20Digital&am=50&cu=INR"
    class="pay-btn">

        💳 Pay ₹50 Now

    </a>

</div>

    <button id="registerBtn">
        Register
    </button>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script type="module" src="js/register.js"></script>

</body>
</html>
