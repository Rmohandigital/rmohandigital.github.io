<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Faculty Dashboard | R Mohan Digital</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #172554
                );

            color: white;
        }


        /* ======================================
           HEADER
        ====================================== */

        header {

            min-height: 75px;

            padding: 15px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            background:
                rgba(15, 23, 42, 0.95);

            border-bottom:
                1px solid #1e40af;

            box-shadow:
                0 0 25px
                rgba(37, 99, 235, 0.25);
        }


        header h1 {

            color: #38bdf8;

            font-size: 24px;
        }


        #logoutBtn {

            border: none;

            padding:
                11px 20px;

            border-radius: 9px;

            background:
                linear-gradient(
                    90deg,
                    #dc2626,
                    #ef4444
                );

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }


        #logoutBtn:hover {

            opacity: 0.85;

            transform:
                translateY(-1px);
        }


        /* ======================================
           MAIN CONTAINER
        ====================================== */

        .container {

            width: 100%;

            max-width: 1200px;

            margin: auto;

            padding: 30px 20px;
        }


        /* ======================================
           WELCOME CARD
        ====================================== */

        .welcome {

            padding: 25px;

            margin-bottom: 25px;

            border-radius: 16px;

            background:
                rgba(15, 23, 42, 0.95);

            border:
                1px solid #1e40af;

            box-shadow:
                0 0 25px
                rgba(37, 99, 235, 0.15);
        }


        .welcome h2 {

            color: #38bdf8;

            margin-bottom: 12px;

            font-size: 25px;
        }


        .welcome p {

            color: #cbd5e1;

            margin-top: 7px;

            word-break: break-word;
        }


        #facultyName {

            font-size: 18px;

            color: white;
        }


        /* ======================================
           STUDENT SECTION
        ====================================== */

        .section-title {

            color: #38bdf8;

            margin-bottom: 15px;

            font-size: 22px;
        }


        #studentsContainer {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 18px;
        }


        /* ======================================
           STUDENT CARD
        ====================================== */

        .student-card {

            padding: 20px;

            border-radius: 15px;

            background:
                rgba(15, 23, 42, 0.95);

            border:
                1px solid #26365f;

            box-shadow:
                0 0 18px
                rgba(0, 0, 0, 0.25);

            transition:
                0.2s ease;
        }


        .student-card:hover {

            transform:
                translateY(-3px);

            border-color:
                #38bdf8;

            box-shadow:
                0 0 25px
                rgba(56, 189, 248, 0.15);
        }


        .student-card h3 {

            color: #38bdf8;

            font-size: 20px;

            margin-bottom: 15px;
        }


        .student-card p {

            color: #cbd5e1;

            margin:
                8px 0;

            line-height: 1.5;

            word-break: break-word;
        }


        .student-card strong {

            color: white;
        }


        .status {

            display: inline-block;

            padding:
                5px 10px;

            border-radius: 20px;

            background: #14532d;

            color: #86efac;

            font-size: 13px;

            font-weight: bold;
        }


        /* ======================================
           EMPTY / LOADING CARD
        ====================================== */

        .empty {

            grid-column: 1 / -1;

            padding: 30px;

            border-radius: 15px;

            text-align: center;

            background:
                rgba(15, 23, 42, 0.95);

            border:
                1px solid #26365f;

            color: #94a3b8;
        }


        .error {

            color: #fca5a5;
        }


        /* ======================================
           MOBILE
        ====================================== */

        @media (max-width: 600px) {

            header {

                padding:
                    15px;

            }


            header h1 {

                font-size: 19px;

            }


            #logoutBtn {

                padding:
                    9px 13px;

                font-size:
                    13px;

            }


            .container {

                padding:
                    20px 15px;

            }


            .welcome {

                padding:
                    20px;

            }


            .welcome h2 {

                font-size:
                    21px;

            }

        }

    </style>

</head>


<body>


    <!-- ======================================
         HEADER
    ====================================== -->

    <header>

        <h1>
            R Mohan Digital
        </h1>


        <button id="logoutBtn">
            Logout
        </button>

    </header>



    <!-- ======================================
         MAIN
    ====================================== -->

    <main class="container">


        <!-- ==================================
             FACULTY INFORMATION
        ================================== -->

        <section class="welcome">

            <h2>
                Faculty Dashboard
            </h2>


            <p id="facultyName">
                Loading faculty information...
            </p>


            <p id="facultyEmail"></p>


            <p id="facultyRole"></p>

        </section>



        <!-- ==================================
             STUDENTS
        ================================== -->

        <h2 class="section-title">
            My Students
        </h2>


        <div id="studentsContainer">

            <div class="empty">
                Loading students...
            </div>

        </div>


    </main>



    <!-- ======================================
         FIREBASE SCRIPT
    ====================================== -->

    <script type="module">


        // =====================================
        // FIREBASE
        // =====================================

        import {
            auth,
            db
        } from "./firebase.js";


        import {
            onAuthStateChanged,
            signOut
        } from
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        import {
            doc,
            getDoc,
            collection,
            query,
            where,
            getDocs
        } from
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";



        // =====================================
        // HTML ELEMENTS
        // =====================================

        const facultyName =
            document.getElementById(
                "facultyName"
            );


        const facultyEmail =
            document.getElementById(
                "facultyEmail"
            );


        const facultyRole =
            document.getElementById(
                "facultyRole"
            );


        const studentsContainer =
            document.getElementById(
                "studentsContainer"
            );


        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );



        // =====================================
        // AUTHENTICATION CHECK
        // =====================================

        onAuthStateChanged(
            auth,
            async (user) => {


                console.log(
                    "Faculty dashboard user:",
                    user
                );


                // =================================
                // NO LOGIN
                // =================================

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;
                }



                try {


                    // ==============================
                    // GET FACULTY PROFILE
                    // ==============================

                    const facultyRef =
                        doc(
                            db,
                            "users",
                            user.uid
                        );


                    const facultySnapshot =
                        await getDoc(
                            facultyRef
                        );



                    // ==============================
                    // PROFILE NOT FOUND
                    // ==============================

                    if (
                        !facultySnapshot.exists()
                    ) {

                        console.error(
                            "Faculty profile not found."
                        );


                        studentsContainer.innerHTML = `

                            <div class="empty error">

                                Faculty profile not found.

                                <br><br>

                                Firebase UID:

                                <br>

                                <strong>
                                    ${user.uid}
                                </strong>

                                <br><br>

                                Please create this user's
                                profile inside the
                                <strong>users</strong>
                                collection.

                            </div>

                        `;

                        facultyName.textContent =
                            "Profile not configured";

                        facultyEmail.textContent =
                            user.email || "";

                        return;
                    }



                    // ==============================
                    // GET FACULTY DATA
                    // ==============================

                    const faculty =
                        facultySnapshot.data();



                    console.log(
                        "Faculty data:",
                        faculty
                    );



                    // ==============================
                    // CHECK ROLE
                    // ==============================

                    if (
                        faculty.role !==
                        "faculty"
                    ) {

                        studentsContainer.innerHTML = `

                            <div class="empty error">

                                This account is not
                                configured as a faculty account.

                                <br><br>

                                Current role:

                                <strong>
                                    ${faculty.role || "Not set"}
                                </strong>

                            </div>

                        `;

                        return;
                    }



                    // ==============================
                    // DISPLAY FACULTY INFORMATION
                    // ==============================

                    facultyName.textContent =
                        "Welcome, " +
                        (
                            faculty.name ||
                            "Faculty"
                        );


                    facultyEmail.textContent =
                        "Email: " +
                        (
                            faculty.email ||
                            user.email ||
                            "Not available"
                        );


                    facultyRole.textContent =
                        "Role: Faculty";



                    // ==============================
                    // LOAD STUDENTS
                    // ==============================

                    await loadStudents(
                        user.uid
                    );


                } catch (error) {


                    console.error(
                        "Faculty dashboard error:",
                        error
                    );


                    studentsContainer.innerHTML = `

                        <div class="empty error">

                            Unable to load the
                            faculty dashboard.

                            <br><br>

                            ${error.message}

                        </div>

                    `;

                }

            }
        );



        // =====================================
        // LOAD STUDENTS
        // =====================================

        async function loadStudents(
            facultyUID
        ) {


            console.log(
                "Loading students for faculty:",
                facultyUID
            );


            studentsContainer.innerHTML = `

                <div class="empty">

                    Loading your students...

                </div>

            `;



            try {


                // ==============================
                // STUDENT QUERY
                // ==============================

                const studentsQuery =
                    query(
                        collection(
                            db,
                            "students"
                        ),

                        where(
                            "assignedFaculty",
                            "==",
                            facultyUID
                        )
                    );


                const snapshot =
                    await getDocs(
                        studentsQuery
                    );



                console.log(
                    "Students found:",
                    snapshot.size
                );



                // ==============================
                // NO STUDENTS
                // ==============================

                if (
                    snapshot.empty
                ) {

                    studentsContainer.innerHTML = `

                        <div class="empty">

                            <h3>
                                No Students Assigned
                            </h3>

                            <br>

                            No students have been
                            assigned to you yet.

                        </div>

                    `;

                    return;
                }



                // ==============================
                // CLEAR CONTAINER
                // ==============================

                studentsContainer.innerHTML =
                    "";



                // ==============================
                // DISPLAY STUDENTS
                // ==============================

                snapshot.forEach(
                    (studentDoc) => {


                        const student =
                            studentDoc.data();



                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "student-card";



                        // ==========================
                        // CARD
                        // ==========================

                        card.innerHTML = `

                            <h3>
                                ${escapeHTML(
                                    student.name ||
                                    "No Name"
                                )}
                            </h3>


                            <p>

                                <strong>
                                    Email:
                                </strong>

                                ${escapeHTML(
                                    student.email ||
                                    "Not available"
                                )}

                            </p>


                            <p>

                                <strong>
                                    Phone:
                                </strong>

                                ${escapeHTML(
                                    student.phone ||
                                    "Not available"
                                )}

                            </p>


                            <p>

                                <strong>
                                    Course:
                                </strong>

                                ${escapeHTML(
                                    student.course ||
                                    "Not available"
                                )}

                            </p>


                            <p>

                                <strong>
                                    Status:
                                </strong>

                                <span class="status">

                                    ${escapeHTML(
                                        student.status ||
                                        "Not available"
                                    )}

                                </span>

                            </p>

                        `;



                        studentsContainer.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {


                console.error(
                    "Student loading error:",
                    error
                );


                studentsContainer.innerHTML = `

                    <div class="empty error">

                        <h3>
                            Unable to load students
                        </h3>

                        <br>

                        ${escapeHTML(
                            error.message
                        )}

                        <br><br>

                        Check your Firestore
                        security rules.

                    </div>

                `;

            }

        }



        // =====================================
        // SAFE HTML
        // =====================================

        function escapeHTML(
            value
        ) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        // =====================================
        // LOGOUT
        // =====================================

        logoutBtn.addEventListener(
            "click",
            async () => {


                try {


                    logoutBtn.disabled =
                        true;


                    logoutBtn.textContent =
                        "Logging out...";


                    await signOut(
                        auth
                    );


                    window.location.href =
                        "login.html";


                } catch (error) {


                    console.error(
                        "Logout error:",
                        error
                    );


                    logoutBtn.disabled =
                        false;


                    logoutBtn.textContent =
                        "Logout";

                }

            }
        );


    </script>


</body>

</html>
