<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>R Mohan Digital | Control Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top,
                    #102a43 0%,
                    #07111f 35%,
                    #020617 75%);

            color: white;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;

            width: 400px;
            height: 400px;

            background: #00e5ff;

            filter: blur(180px);
            opacity: 0.10;

            top: -150px;
            left: -100px;

            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;

            width: 350px;
            height: 350px;

            background: #2563eb;

            filter: blur(170px);
            opacity: 0.12;

            bottom: -150px;
            right: -100px;

            pointer-events: none;
        }

        .login-card {

            width: 92%;
            max-width: 430px;

            padding: 35px 28px;

            background: rgba(7, 17, 31, 0.88);

            border: 1px solid rgba(0, 229, 255, 0.35);

            border-radius: 22px;

            box-shadow:
                0 0 25px rgba(0, 229, 255, 0.12),
                0 0 80px rgba(37, 99, 235, 0.08);

            backdrop-filter: blur(15px);

            position: relative;
            z-index: 2;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {

            width: 72px;
            height: 72px;

            margin: 0 auto 15px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
            font-weight: bold;

            border: 2px solid #00e5ff;

            box-shadow:
                0 0 15px #00e5ff,
                inset 0 0 15px rgba(0, 229, 255, 0.15);

        }

        .brand h1 {

            font-size: 25px;

            color: #ffffff;

            text-shadow:
                0 0 10px rgba(0, 229, 255, 0.6);

        }

        .brand span {

            display: block;

            margin-top: 7px;

            color: #38bdf8;

            font-size: 13px;

            letter-spacing: 2px;

        }

        .role-title {

            text-align: center;

            color: #94a3b8;

            font-size: 14px;

            margin-bottom: 15px;

        }

        .role-buttons {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 7px;

            margin-bottom: 25px;

        }

        .role-btn {

            padding: 12px 4px;

            border-radius: 10px;

            border: 1px solid #1e3a5f;

            background: rgba(15, 23, 42, 0.8);

            color: #cbd5e1;

            cursor: pointer;

            transition: 0.25s;

            font-size: 11px;

        }

        .role-btn:hover {

            border-color: #00e5ff;

            color: #00e5ff;

            box-shadow:
                0 0 12px rgba(0, 229, 255, 0.25);

            transform: translateY(-2px);

        }

        .role-btn.selected {

            background: rgba(0, 229, 255, 0.10);

            border-color: #00e5ff;

            color: #00e5ff;

            box-shadow:
                0 0 15px rgba(0, 229, 255, 0.25);

        }

        .input-group {

            margin-bottom: 17px;

        }

        .input-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            color: #94a3b8;

        }

        .input-box {

            position: relative;
            width: 100%;

        }

        .input-box input {

            width: 100%;

            padding: 14px 48px 14px 14px;

            border-radius: 10px;

            border: 1px solid #1e3a5f;

            outline: none;

            background: #07111f;

            color: white;

            font-size: 14px;

            transition: 0.25s;

        }

        .input-box input:focus {

            border-color: #00e5ff;

            box-shadow:
                0 0 12px rgba(0, 229, 255, 0.18);

        }

        .input-box input::placeholder {

            color: #64748b;

        }

        /* ================================
           PASSWORD EYE BUTTON
           ================================ */

        .toggle-password {

            position: absolute;

            right: 8px;
            top: 50%;

            width: 36px;
            height: 36px;

            transform: translateY(-50%);

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;

            border: none;

            border-radius: 8px;

            color: #38bdf8;

            cursor: pointer;

            font-size: 20px;

            padding: 0;

            z-index: 5;

            transition: 0.2s;

        }

        .toggle-password:hover {

            color: #00e5ff;

            background: rgba(0, 229, 255, 0.10);

            box-shadow:
                0 0 10px rgba(0, 229, 255, 0.15);

        }

        .toggle-password:active {

            transform: translateY(-50%) scale(0.92);

        }

        .toggle-password:focus {

            outline: 1px solid #00e5ff;

            outline-offset: 1px;

        }

        .login-btn {

            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #0284c7,
                    #00e5ff
                );

            color: #001018;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 20px rgba(0, 229, 255, 0.22);

            transition: 0.25s;

        }

        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 0 30px rgba(0, 229, 255, 0.40);

        }

        .login-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }

        #loginMessage {

            min-height: 22px;

            text-align: center;

            margin-top: 15px;

            font-size: 13px;

        }

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #475569;

            font-size: 11px;

        }

        @media (max-width: 500px) {

            .login-card {

                padding: 28px 20px;

            }

            .role-buttons {

                grid-template-columns: repeat(2, 1fr);

                gap: 8px;

            }

            .role-btn {

                font-size: 12px;

            }

        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- BRAND -->

    <div class="brand">

        <div class="brand-icon">
            RM
        </div>

        <h1>R Mohan Digital</h1>

        <span>CONTROL CENTER</span>

    </div>


    <!-- ROLE -->

    <div class="role-title">
        Select your access
    </div>


    <div class="role-buttons">

        <button
            type="button"
            class="role-btn"
            data-role="mentor">

            👨‍🏫<br>
            Mentor

        </button>


        <button
            type="button"
            class="role-btn"
            data-role="admin">

            👑<br>
            Owner

        </button>


        <button
            type="button"
            class="role-btn"
            data-role="editor">

            ✏️<br>
            Editor

        </button>


        <button
            type="button"
            class="role-btn"
            data-role="faculty">

            🎓<br>
            Faculty

        </button>

    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- EMAIL -->

        <div class="input-group">

            <label for="loginEmail">
                Email Address
            </label>

            <div class="input-box">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label for="loginPassword">
                Password
            </label>

            <div class="input-box">

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

                <!-- PASSWORD SHOW/HIDE -->

                <button
                    type="button"
                    class="toggle-password"
                    id="toggleLoginPassword"
                    aria-label="Show password"
                    title="Show password">

                    👁

                </button>

            </div>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-btn"
            id="loginButton">

            Login

        </button>


        <!-- MESSAGE -->

        <div id="loginMessage"></div>


    </form>


    <!-- FOOTER -->

    <div class="footer">

        © 2026 R Mohan Digital

    </div>


</div>


<!-- =========================================
     PASSWORD SHOW/HIDE SCRIPT
     ========================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const passwordInput =
        document.getElementById("loginPassword");

    const toggleButton =
        document.getElementById("toggleLoginPassword");


    if (!passwordInput || !toggleButton) {

        console.error(
            "Password input or toggle button not found."
        );

        return;

    }


    toggleButton.addEventListener("click", function () {

        if (passwordInput.type === "password") {

            /* SHOW PASSWORD */

            passwordInput.type = "text";

            toggleButton.textContent = "🙈";

            toggleButton.setAttribute(
                "aria-label",
                "Hide password"
            );

            toggleButton.setAttribute(
                "title",
                "Hide password"
            );

        } else {

            /* HIDE PASSWORD */

            passwordInput.type = "password";

            toggleButton.textContent = "👁";

            toggleButton.setAttribute(
                "aria-label",
                "Show password"
            );

            toggleButton.setAttribute(
                "title",
                "Show password"
            );

        }

    });

});

</script>


<!-- YOUR EXISTING AUTH SYSTEM -->

<script
    type="module"
    src="js/auth.js">
</script>


</body>

</html>
