<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile | R Mohan Digital</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    #102a43 0%,
                    #07111f 35%,
                    #020617 75%
                );

            color: white;

            padding: 25px;

        }


        .container {

            max-width: 1150px;

            margin: auto;

        }


        /* ==========================================
           TOPBAR
        ========================================== */

        .topbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 22px;

            padding: 18px 22px;

            border-radius: 15px;

            background:
                rgba(7, 17, 31, 0.9);

            border:
                1px solid rgba(0, 229, 255, 0.18);

            backdrop-filter: blur(12px);

        }


        .topbar h1 {

            font-size: 21px;

        }


        .topbar h1 span {

            color: #00e5ff;

            text-shadow:
                0 0 10px rgba(0, 229, 255, 0.4);

        }


        .back-btn {

            padding: 10px 15px;

            border:
                1px solid #00e5ff;

            border-radius: 8px;

            background:
                rgba(0, 229, 255, 0.08);

            color: #00e5ff;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;

        }


        .back-btn:hover {

            background: #00e5ff;

            color: #020617;

            box-shadow:
                0 0 15px rgba(0, 229, 255, 0.3);

        }


        /* ==========================================
           STUDENT HEADER
        ========================================== */

        .profile-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 25px;

            margin-bottom: 20px;

            border-radius: 16px;

            background:
                rgba(7, 17, 31, 0.88);

            border:
                1px solid rgba(0, 229, 255, 0.18);

        }


        .profile-left {

            display: flex;

            align-items: center;

            gap: 20px;

        }


        .avatar {

            width: 90px;

            height: 90px;

            border-radius: 50%;

            flex-shrink: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            background:
                rgba(0, 229, 255, 0.08);

            border:
                2px solid #00e5ff;

            color: #00e5ff;

            font-size: 35px;

            box-shadow:
                0 0 20px rgba(0, 229, 255, 0.18);

        }


        .avatar img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .profile-info h2 {

            color: #00e5ff;

            font-size: 25px;

            margin-bottom: 8px;

        }


        .profile-info p {

            color: #94a3b8;

            font-size: 12px;

            margin: 5px 0;

        }


        .active-badge {

            display: inline-block;

            margin-top: 6px;

            padding: 5px 10px;

            border-radius: 20px;

            color: #22c55e;

            background:
                rgba(34, 197, 94, 0.08);

            border:
                1px solid rgba(34, 197, 94, 0.25);

            font-size: 9px;

            font-weight: bold;

        }


        /* ==========================================
           MANAGE BUTTON
        ========================================== */

        .manage-btn {

            padding: 13px 18px;

            border:
                1px solid #00e5ff;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 229, 255, 0.15),
                    rgba(37, 99, 235, 0.15)
                );

            color: #00e5ff;

            cursor: pointer;

            font-weight: bold;

            font-size: 12px;

            transition: 0.2s;

            white-space: nowrap;

        }


        .manage-btn:hover {

            background: #00e5ff;

            color: #020617;

            box-shadow:
                0 0 20px rgba(0, 229, 255, 0.3);

            transform: translateY(-2px);

        }


        /* ==========================================
           STATS
        ========================================== */

        .stats-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 20px;

        }


        .stat-card {

            padding: 20px;

            border-radius: 14px;

            background:
                rgba(7, 17, 31, 0.85);

            border:
                1px solid rgba(0, 229, 255, 0.14);

        }


        .stat-icon {

            font-size: 25px;

            margin-bottom: 10px;

        }


        .stat-card h3 {

            color: #00e5ff;

            font-size: 24px;

        }


        .stat-card p {

            color: #64748b;

            font-size: 10px;

            margin-top: 5px;

        }


        /* ==========================================
           CONTENT GRID
        ========================================== */

        .content-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;

        }


        .card {

            padding: 22px;

            border-radius: 15px;

            background:
                rgba(7, 17, 31, 0.86);

            border:
                1px solid rgba(0, 229, 255, 0.14);

        }


        .card.full {

            grid-column:
                1 / -1;

        }


        .card h2 {

            color: #00e5ff;

            font-size: 17px;

            margin-bottom: 18px;

        }


        /* ==========================================
           DETAILS
        ========================================== */

        .details-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

        }


        .detail {

            padding: 13px;

            border-radius: 9px;

            background:
                rgba(15, 23, 42, 0.7);

            border:
                1px solid rgba(148, 163, 184, 0.07);

        }


        .detail label {

            display: block;

            color: #64748b;

            font-size: 9px;

            margin-bottom: 6px;

            text-transform: uppercase;

        }


        .detail span {

            color: #e2e8f0;

            font-size: 12px;

            word-break: break-word;

        }


        /* ==========================================
           FACULTY
        ========================================== */

        .faculty-box {

            padding: 18px;

            border-radius: 12px;

            background:
                rgba(15, 23, 42, 0.7);

            border:
                1px solid rgba(0, 229, 255, 0.1);

        }


        .faculty-box h3 {

            color: #e2e8f0;

            font-size: 15px;

            margin-bottom: 8px;

        }


        .faculty-box p {

            color: #94a3b8;

            font-size: 11px;

            margin: 5px 0;

        }


        /* ==========================================
           BIOGRAPHY
        ========================================== */

        .bio {

            color: #94a3b8;

            font-size: 12px;

            line-height: 1.7;

            white-space: pre-wrap;

        }


        /* ==========================================
           RECORDS
        ========================================== */

        .record {

            padding: 14px;

            margin-bottom: 10px;

            border-radius: 10px;

            background:
                rgba(15, 23, 42, 0.7);

            border:
                1px solid rgba(148, 163, 184, 0.08);

        }


        .record-title {

            color: #e2e8f0;

            font-weight: bold;

            font-size: 12px;

        }


        .record-subtitle {

            color: #64748b;

            font-size: 10px;

            margin-top: 5px;

        }


        .present {

            color: #22c55e;

        }


        .absent {

            color: #ef4444;

        }


        .marks {

            color: #00e5ff;

            font-size: 18px;

            font-weight: bold;

        }


        /* ==========================================
           EMPTY
        ========================================== */

        .empty {

            padding: 25px;

            text-align: center;

            color: #64748b;

            font-size: 11px;

        }


        /* ==========================================
           LOADING / ERROR
        ========================================== */

        .loading {

            min-height: 70vh;

            display: flex;

            justify-content: center;

            align-items: center;

            color: #00e5ff;

            text-align: center;

        }


        .error {

            min-height: 70vh;

            display: flex;

            justify-content: center;

            align-items: center;

            color: #f87171;

            text-align: center;

        }


        /* ==========================================
           TOAST
        ========================================== */

        #toast {

            position: fixed;

            right: 20px;

            bottom: 20px;

            padding: 13px 17px;

            min-width: 250px;

            background: #07111f;

            border:
                1px solid #00e5ff;

            border-radius: 9px;

            color: #e2e8f0;

            opacity: 0;

            transform:
                translateY(80px);

            pointer-events: none;

            transition: 0.3s;

            z-index: 1000;

        }


        #toast.show {

            opacity: 1;

            transform:
                translateY(0);

        }


        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 900px) {

            .stats-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 750px) {

            .profile-header {

                flex-direction: column;

                align-items: flex-start;

            }


            .content-grid {

                grid-template-columns:
                    1fr;

            }


            .card.full {

                grid-column: auto;

            }

        }


        @media (max-width: 550px) {

            body {

                padding: 12px;

            }


            .topbar {

                flex-direction: column;

                align-items: flex-start;

            }


            .profile-left {

                flex-direction: column;

                align-items: flex-start;

            }


            .stats-grid {

                grid-template-columns:
                    1fr;

            }


            .details-grid {

                grid-template-columns:
                    1fr;

            }


            .manage-btn {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==========================================
         TOPBAR
    ========================================== -->

    <div class="topbar">

        <h1>

            Student
            <span>Profile</span>

        </h1>


        <button
            class="back-btn"
            id="backBtn">

            ← Back to Students

        </button>

    </div>


    <!-- ==========================================
         CONTENT
    ========================================== -->

    <div id="pageContent">

        <div class="loading">

            Loading student profile...

        </div>

    </div>


</div>


<div id="toast"></div>


<script type="module">


import {
    auth,
    db
} from "./firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


// ======================================================
// ELEMENTS
// ======================================================

const pageContent =
    document.getElementById(
        "pageContent"
    );


const backBtn =
    document.getElementById(
        "backBtn"
    );


// ======================================================
// STUDENT ID
// ======================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const studentId =
    params.get("id");


// ======================================================
// DATA
// ======================================================

let currentFaculty = null;

let studentData = null;

let attendanceRecords = [];

let marksRecords = [];


// ======================================================
// BACK BUTTON
// ======================================================

backBtn.addEventListener(
    "click",
    () => {

        window.location.href =
            "faculty-dashboard.html#studentsSection";

    }
);


// ======================================================
// AUTH
// ======================================================

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        if (!studentId) {

            showError(
                "Student ID is missing."
            );

            return;

        }


        try {

            // ==========================================
            // LOAD FACULTY
            // ==========================================

            const facultyRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const facultySnapshot =
                await getDoc(
                    facultyRef
                );


            if (
                !facultySnapshot.exists()
            ) {

                showError(
                    "Faculty profile not found."
                );

                return;

            }


            const faculty =
                facultySnapshot.data();


            const facultyRole =
                String(
                    faculty.role || ""
                )
                .trim()
                .toLowerCase();


            const facultyStatus =
                String(
                    faculty.status || ""
                )
                .trim()
                .toLowerCase();


            if (
                facultyRole !==
                    "faculty"
            ) {

                showError(
                    "Only faculty members can view student profiles."
                );

                return;

            }


            if (
                facultyStatus !==
                    "active"
            ) {

                showError(
                    "Your faculty account is not active."
                );

                return;

            }


            currentFaculty = {

                uid:
                    user.uid,

                ...faculty

            };


            // ==========================================
            // LOAD STUDENT
            // ==========================================

            const studentRef =
                doc(
                    db,
                    "users",
                    studentId
                );


            const studentSnapshot =
                await getDoc(
                    studentRef
                );


            if (
                !studentSnapshot.exists()
            ) {

                showError(
                    "Student profile not found."
                );

                return;

            }


            studentData =
                studentSnapshot.data();


            const studentRole =
                String(
                    studentData.role || ""
                )
                .trim()
                .toLowerCase();


            if (
                studentRole !==
                    "student"
            ) {

                showError(
                    "This account is not a student."
                );

                return;

            }


            // ==========================================
            // ASSIGNMENT CHECK
            // ==========================================

            if (
                studentData.facultyId !==
                currentFaculty.uid
            ) {

                showError(
                    "This student is not assigned to you."
                );

                return;

            }


            // ==========================================
            // LOAD EVERYTHING
            // ==========================================

            await Promise.all([

                loadAttendance(),

                loadMarks(),

                loadAssignedFaculty()

            ]);


            renderPage();


        }

        catch (error) {

            console.error(
                "Student profile error:",
                error
            );


            showError(
                "Unable to load student profile."
            );

        }

    }
);


// ======================================================
// LOAD ATTENDANCE
// ======================================================

async function loadAttendance() {

    const attendanceQuery =
        query(
            collection(
                db,
                "attendance"
            ),

            where(
                "studentId",
                "==",
                studentId
            ),

            where(
                "facultyId",
                "==",
                currentFaculty.uid
            )
        );


    const snapshot =
        await getDocs(
            attendanceQuery
        );


    attendanceRecords = [];


    snapshot.forEach(
        item => {

            attendanceRecords.push({

                id:
                    item.id,

                ...item.data()

            });

        }
    );


    attendanceRecords.sort(
        (a, b) => {

            return String(
                b.date || ""
            )
            .localeCompare(
                String(
                    a.date || ""
                )
            );

        }
    );

}


// ======================================================
// LOAD MARKS
// ======================================================

async function loadMarks() {

    const marksQuery =
        query(
            collection(
                db,
                "marks"
            ),

            where(
                "studentId",
                "==",
                studentId
            ),

            where(
                "facultyId",
                "==",
                currentFaculty.uid
            )
        );


    const snapshot =
        await getDocs(
            marksQuery
        );


    marksRecords = [];


    snapshot.forEach(
        item => {

            marksRecords.push({

                id:
                    item.id,

                ...item.data()

            });

        }
    );


}


// ======================================================
// ASSIGNED FACULTY
// ======================================================

async function loadAssignedFaculty() {

    const facultyId =
        studentData.facultyId;


    if (!facultyId) {

        return;

    }


    try {

        const facultyRef =
            doc(
                db,
                "users",
                facultyId
            );


        const snapshot =
            await getDoc(
                facultyRef
            );


        if (
            snapshot.exists()
        ) {

            studentData.assignedFaculty =
                snapshot.data();

        }

    }

    catch (error) {

        console.error(
            "Faculty loading error:",
            error
        );

    }

}


// ======================================================
// RENDER PAGE
// ======================================================

function renderPage() {

    const name =
        studentData.name ||
        studentData.displayName ||
        "Student";


    const email =
        studentData.email ||
        "Not available";


    const phone =
        studentData.phone ||
        studentData.mobile ||
        "Not available";


    const course =
        studentData.course ||
        studentData.courseName ||
        "Not assigned";


    const status =
        studentData.status ||
        "Active";


    const photo =
        studentData.photoURL ||
        studentData.photo ||
        "";


    const avatar =
        photo

        ? `
            <img
                src="${escapeHTML(photo)}"
                alt="Student Photo"
            >
          `

        : "🎓";


    const attendanceStats =
        calculateAttendance();


    const marksStats =
        calculateMarks();


    const faculty =
        studentData.assignedFaculty;


    pageContent.innerHTML = `

        <!-- ==========================================
             PROFILE HEADER
        =========================================== -->

        <div class="profile-header">


            <div class="profile-left">


                <div class="avatar">

                    ${avatar}

                </div>


                <div class="profile-info">

                    <h2>

                        ${escapeHTML(name)}

                    </h2>


                    <p>

                        📧
                        ${escapeHTML(email)}

                    </p>


                    <p>

                        📚
                        ${escapeHTML(course)}

                    </p>


                    <span class="active-badge">

                        ✓
                        ${escapeHTML(
                            String(status).toUpperCase()
                        )}

                    </span>

                </div>


            </div>


            <!-- ======================================
                 MANAGE BUTTON
            ======================================= -->

            <button
                class="manage-btn"
                id="manageAcademicBtn">

                📊 Manage Attendance & Marks

            </button>


        </div>


        <!-- ==========================================
             STATS
        =========================================== -->

        <div class="stats-grid">


            <div class="stat-card">

                <div class="stat-icon">
                    📅
                </div>

                <h3>

                    ${attendanceStats.percentage}%

                </h3>

                <p>
                    Attendance
                </p>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ✓
                </div>

                <h3>

                    ${attendanceStats.present}

                </h3>

                <p>
                    Present
                </p>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ✕
                </div>

                <h3>

                    ${attendanceStats.absent}

                </h3>

                <p>
                    Absent
                </p>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    📝
                </div>

                <h3>

                    ${marksStats.average}%

                </h3>

                <p>
                    Marks Average
                </p>

            </div>


        </div>


        <!-- ==========================================
             CONTENT
        =========================================== -->

        <div class="content-grid">


            <!-- ======================================
                 PERSONAL INFORMATION
            ======================================= -->

            <div class="card">

                <h2>
                    👤 Personal Information
                </h2>


                <div class="details-grid">


                    <div class="detail">

                        <label>
                            Full Name
                        </label>

                        <span>
                            ${escapeHTML(name)}
                        </span>

                    </div>


                    <div class="detail">

                        <label>
                            Email
                        </label>

                        <span>
                            ${escapeHTML(email)}
                        </span>

                    </div>


                    <div class="detail">

                        <label>
                            Phone
                        </label>

                        <span>
                            ${escapeHTML(phone)}
                        </span>

                    </div>


                    <div class="detail">

                        <label>
                            Date of Birth
                        </label>

                        <span>
                            ${escapeHTML(
                                studentData.dob ||
                                studentData.dateOfBirth ||
                                "Not provided"
                            )}
                        </span>

                    </div>


                    <div class="detail">

                        <label>
                            Gender
                        </label>

                        <span>
                            ${escapeHTML(
                                studentData.gender ||
                                "Not provided"
                            )}
                        </span>

                    </div>


                    <div class="detail">

                        <label>
                            Student UID
                        </label>

                        <span>
                            ${escapeHTML(studentId)}
                        </span>

                    </div>


                </div>

            </div>


            <!-- ======================================
                 ACADEMIC INFORMATION
            ======================================= -->

            <div class="card">

                <h2>
                    🎓 Academic Information
                </h2>


                <div class="details-grid">


                    <div class="detail">

                        <label>
                            Course
                        </label>

                        <span>
                            ${escapeHTML(course)}
                        </span>

                    </div>


                    <div class="detail">

                        <label>
                            Role
                        </label>

                        <span>
                            ${escapeHTML(
                                studentData.role ||
                                "Student"
                            )}
                        </span>

                    </div>


                    <div class="detail">

                        <label>
                            Status
                        </label>

                        <span>
                            ${escapeHTML(status)}
                        </span>

                    </div>


                    <div class="detail">

                        <label>
                            Faculty ID
                        </label>

                        <span>
                            ${escapeHTML(
                                studentData.facultyId ||
                                "Not assigned"
                            )}
                        </span>

                    </div>


                </div>

            </div>


            <!-- ======================================
                 ASSIGNED FACULTY
            ======================================= -->

            <div class="card full">

                <h2>
                    👨‍🏫 Assigned Faculty
                </h2>


                ${
                    faculty

                    ? `

                    <div class="faculty-box">

                        <h3>

                            ${escapeHTML(
                                faculty.name ||
                                faculty.displayName ||
                                "Faculty"
                            )}

                        </h3>


                        <p>

                            📧
                            ${escapeHTML(
                                faculty.email ||
                                "No email"
                            )}

                        </p>


                        <p>

                            📱
                            ${escapeHTML(
                                faculty.phone ||
                                faculty.mobile ||
                                "No phone"
                            )}

                        </p>


                        <p>

                            📚
                            ${escapeHTML(
                                faculty.course ||
                                "Not specified"
                            )}

                        </p>

                    </div>

                    `

                    : `

                    <div class="empty">

                        No faculty information available.

                    </div>

                    `

                }

            </div>


            <!-- ======================================
                 ATTENDANCE
            ======================================= -->

            <div class="card">

                <h2>
                    📅 Recent Attendance
                </h2>


                <div id="attendanceList">

                    ${renderAttendanceHTML()}

                </div>

            </div>


            <!-- ======================================
                 MARKS
            ======================================= -->

            <div class="card">

                <h2>
                    📝 Recent Marks
                </h2>


                <div id="marksList">

                    ${renderMarksHTML()}

                </div>

            </div>


            <!-- ======================================
                 BIOGRAPHY
            ======================================= -->

            <div class="card full">

                <h2>
                    📖 Biography
                </h2>


                <div class="bio">

                    ${escapeHTML(
                        studentData.biography ||
                        studentData.bio ||
                        "No biography provided."
                    )}

                </div>

            </div>


        </div>

    `;


    // ==================================================
    // MANAGE ACADEMIC BUTTON
    // ==================================================

    document
        .getElementById(
            "manageAcademicBtn"
        )
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    `student-academic.html?id=${encodeURIComponent(studentId)}`;

            }
        );

}


// ======================================================
// ATTENDANCE CALCULATION
// ======================================================

function calculateAttendance() {

    let present = 0;

    let absent = 0;


    attendanceRecords.forEach(
        record => {

            const status =
                String(
                    record.status || ""
                )
                .trim()
                .toLowerCase();


            if (
                status === "present" ||
                status === "p"
            ) {

                present++;

            }

            else if (
                status === "absent" ||
                status === "a"
            ) {

                absent++;

            }

        }
    );


    const total =
        present + absent;


    const percentage =
        total > 0

        ? (
            (present / total) *
            100
          ).toFixed(1)

        : "0";


    return {

        present,

        absent,

        total,

        percentage

    };

}


// ======================================================
// MARKS CALCULATION
// ======================================================

function calculateMarks() {

    let totalPercentage = 0;

    let count = 0;


    marksRecords.forEach(
        record => {

            const marks =
                Number(
                    record.marks || 0
                );


            const maxMarks =
                Number(
                    record.maxMarks || 0
                );


            if (
                maxMarks > 0
            ) {

                totalPercentage +=
                    (
                        marks /
                        maxMarks
                    ) * 100;

                count++;

            }

        }
    );


    const average =
        count > 0

        ? (
            totalPercentage /
            count
          ).toFixed(1)

        : "0";


    return {

        average,

        count

    };

}

// ATTENDANCE HTML
// ======================================================

function renderAttendanceHTML() {

    if (
        attendanceRecords.length === 0
    ) {

        return `

            <div class="empty">

                📅

                <br><br>

                No attendance records yet.

            </div>

        `;

    }


    const records =
        attendanceRecords.slice(
            0,
            8
        );


    return records.map(
        record => {

            const status =
                String(
                    record.status || ""
                )
                .trim()
                .toLowerCase();


            const isPresent =
                status ===
                "present";


            return `

                <div class="record">

                    <div class="record-title">

                        ${escapeHTML(
                            record.subject ||
                            "Subject"
                        )}

                    </div>


                    <div class="record-subtitle">

                        📅
                        ${escapeHTML(
                            record.date ||
                            "No date"
                        )}

                        &nbsp; • &nbsp;

                        <span class="${
                            isPresent
                            ? "present"
                            : "absent"
                        }">

                            ${
                                isPresent
                                ? "✓ Present"
                                : "✕ Absent"
                            }

                        </span>

                    </div>

                </div>

            `;

        }
    ).join("");

}

// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
