<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignments | R Mohan Digital</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f9ff;
            color: #102a43;
            min-height: 100vh;
        }

        /* ================= HEADER ================= */

        header {
            background: linear-gradient(135deg, #ffffff, #eaf4ff);
            border-bottom: 1px solid #d8e8f8;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 3px 15px rgba(0, 80, 150, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: linear-gradient(135deg, #087cff, #00b7ff);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.25);
        }

        .brand h2 {
            color: #087cff;
            font-size: 21px;
        }

        .brand p {
            color: #78909c;
            font-size: 12px;
            margin-top: 2px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .back-btn {
            background: #e7f2ff;
            color: #087cff;
        }

        .logout-btn {
            background: #087cff;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* ================= MAIN ================= */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px 50px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 30px;
            color: #102a43;
        }

        .page-title p {
            color: #78909c;
            margin-top: 7px;
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border: 1px solid #dfebf7;
            border-radius: 15px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0, 80, 150, 0.06);
        }

        .stat-icon {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .stat-card h3 {
            font-size: 27px;
            color: #087cff;
        }

        .stat-card p {
            color: #78909c;
            margin-top: 5px;
            font-size: 14px;
        }

        /* ================= ASSIGNMENTS ================= */

        .section {
            margin-top: 25px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-header h2 {
            color: #102a43;
            font-size: 21px;
        }

        .refresh-btn {
            background: #e7f2ff;
            color: #087cff;
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .assignment-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .assignment-card {
            background: white;
            border: 1px solid #dfebf7;
            border-radius: 15px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0, 80, 150, 0.06);
            transition: 0.2s;
            position: relative;
        }

        .assignment-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 80, 150, 0.11);
        }

        .assignment-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
        }

        .assignment-title {
            font-size: 19px;
            color: #102a43;
            font-weight: bold;
        }

        .subject {
            color: #087cff;
            font-size: 13px;
            font-weight: bold;
            margin-top: 7px;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status.pending {
            background: #e7f2ff;
            color: #087cff;
        }

        .status.today {
            background: #fff4d6;
            color: #b77900;
        }

        .status.overdue {
            background: #ffe5e5;
            color: #d93025;
        }

        .status.no-date {
            background: #edf1f5;
            color: #607d8b;
        }

        .description {
            color: #607d8b;
            font-size: 14px;
            line-height: 1.6;
            margin: 17px 0;
        }

        .assignment-info {
            border-top: 1px solid #edf2f7;
            padding-top: 14px;
            display: grid;
            gap: 9px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #607d8b;
            font-size: 13px;
        }

        .info-row strong {
            color: #263238;
        }

        .view-btn {
            width: 100%;
            margin-top: 17px;
            padding: 11px;
            border: none;
            border-radius: 9px;
            background: #087cff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #006ce0;
        }

        /* ================= LOADING ================= */

        .loading {
            background: white;
            border: 1px solid #dfebf7;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            color: #78909c;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid #dcecff;
            border-top: 4px solid #087cff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty {
            background: white;
            border: 1px solid #dfebf7;
            border-radius: 15px;
            padding: 55px 20px;
            text-align: center;
        }

        .empty-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty h3 {
            color: #263238;
            margin-bottom: 7px;
        }

        .empty p {
            color: #78909c;
        }

        /* ================= MODAL ================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 20, 40, 0.55);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #102a43;
        }

        .close-btn {
            border: none;
            background: #edf4fb;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            color: #607d8b;
        }

        .modal-content p {
            color: #607d8b;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .modal-detail {
            background: #f5faff;
            border-radius: 10px;
            padding: 13px;
            margin-bottom: 10px;
        }

        .modal-detail span {
            display: block;
            font-size: 12px;
            color: #78909c;
            margin-bottom: 4px;
        }

        .modal-detail strong {
            color: #263238;
        }

        /* ================= TOAST ================= */

        #toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #102a43;
            color: white;
            padding: 13px 18px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            z-index: 1000;
            font-size: 14px;
        }

        #toast.show {
            display: block;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .assignment-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 14px;
            }

            .brand h2 {
                font-size: 17px;
            }

            .brand p {
                display: none;
            }

            .logo {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }

            .header-buttons {
                gap: 5px;
            }

            .btn {
                padding: 8px 10px;
                font-size: 12px;
            }

            .container {
                padding: 22px 14px 40px;
            }

            .page-title h1 {
                font-size: 25px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 16px;
            }

            .stat-card h3 {
                font-size: 23px;
            }

            .assignment-card {
                padding: 17px;
            }

            .assignment-top {
                flex-direction: column;
            }

            .status {
                align-self: flex-start;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">
        <div class="logo">RM</div>

        <div>
            <h2>R Mohan Digital</h2>
            <p>Student Portal</p>
        </div>
    </div>

    <div class="header-buttons">
        <button class="btn back-btn" onclick="goDashboard()">
            ← Dashboard
        </button>

        <button class="btn logout-btn" id="logoutBtn">
            Logout
        </button>
    </div>
</header>


<main class="container">

    <div class="page-title">
        <h1>📚 Assignments</h1>
        <p>View assignments given by your faculty.</p>
    </div>


    <!-- ================= STATS ================= -->

    <div class="stats">

        <div class="stat-card">
            <div class="stat-icon">📚</div>
            <h3 id="totalAssignments">0</h3>
            <p>Total Assignments</p>
        </div>

        <div class="stat-card">
            <div class="stat-icon">📝</div>
            <h3 id="pendingAssignments">0</h3>
            <p>Pending</p>
        </div>

        <div class="stat-card">
            <div class="stat-icon">⏰</div>
            <h3 id="todayAssignments">0</h3>
            <p>Due Today</p>
        </div>

        <div class="stat-card">
            <div class="stat-icon">⚠️</div>
            <h3 id="overdueAssignments">0</h3>
            <p>Overdue</p>
        </div>

    </div>


    <!-- ================= ASSIGNMENT SECTION ================= -->

    <section class="section">

        <div class="section-header">
            <h2>My Assignments</h2>

            <button class="refresh-btn" id="refreshBtn">
                🔄 Refresh
            </button>
        </div>

        <div id="assignmentContainer">

            <div class="loading">
                <div class="spinner"></div>
                Loading assignments...
            </div>

        </div>

    </section>

</main>


<!-- ================= MODAL ================= -->

<div class="modal" id="assignmentModal">

    <div class="modal-box">

        <div class="modal-header">
            <h2 id="modalTitle">Assignment</h2>

            <button class="close-btn" id="closeModal">
                ×
            </button>
        </div>

        <div class="modal-content">

            <div class="modal-detail">
                <span>Subject</span>
                <strong id="modalSubject">-</strong>
            </div>

            <div class="modal-detail">
                <span>Faculty</span>
                <strong id="modalFaculty">-</strong>
            </div>

            <div class="modal-detail">
                <span>Due Date</span>
                <strong id="modalDueDate">-</strong>
            </div>

            <div class="modal-detail">
                <span>Status</span>
                <strong id="modalStatus">-</strong>
            </div>

            <p id="modalDescription">
                -
            </p>

        </div>

    </div>

</div>


<div id="toast"></div>


<!-- ================= FIREBASE ================= -->

<script type="module">

    import {
        auth,
        db
    } from "./firebase.js";

    import {
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    import {
        collection,
        doc,
        getDoc,
        getDocs,
        query,
        where
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    /* ==========================================
       GLOBAL VARIABLES
    ========================================== */

    let currentUser = null;
    let currentProfile = null;
    let assignments = [];


    /* ==========================================
       ELEMENTS
    ========================================== */

    const assignmentContainer =
        document.getElementById("assignmentContainer");

    const totalAssignments =
        document.getElementById("totalAssignments");

    const pendingAssignments =
        document.getElementById("pendingAssignments");

    const todayAssignments =
        document.getElementById("todayAssignments");

    const overdueAssignments =
        document.getElementById("overdueAssignments");

    const refreshBtn =
        document.getElementById("refreshBtn");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const modal =
        document.getElementById("assignmentModal");

    const closeModal =
        document.getElementById("closeModal");


    /* ==========================================
       DASHBOARD
    ========================================== */

    window.goDashboard = function () {

        window.location.href = "dashboard.html";

    };


    /* ==========================================
       AUTHENTICATION
    ========================================== */

    onAuthStateChanged(auth, async (user) => {

        if (!user) {

            window.location.href = "login.html";

            return;
        }

        currentUser = user;

        try {

            const profileRef =
                doc(db, "users", user.uid);

            const profileSnap =
                await getDoc(profileRef);


            if (!profileSnap.exists()) {

                showToast("Student profile not found.");

                await signOut(auth);

                window.location.href = "login.html";

                return;
            }


            currentProfile =
                profileSnap.data();


            const role =
                String(currentProfile.role || "")
                    .toLowerCase()
                    .trim();


            const status =
                String(currentProfile.status || "")
                    .toLowerCase()
                    .trim();


            if (role !== "student") {

                showToast("This page is available only for students.");

                setTimeout(() => {

                    window.location.href =
                        "login.html";

                }, 1500);

                return;
            }


            if (
                status !== "" &&
                status !== "active"
            ) {

                showToast("Your account is not active.");

                setTimeout(() => {

                    window.location.href =
                        "login.html";

                }, 1500);

                return;
            }


            await loadAssignments();

        }
        catch (error) {

            console.error(
                "Authentication error:",
                error
            );

            assignmentContainer.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">⚠️</div>
                    <h3>Unable to load page</h3>
                    <p>
                        ${escapeHTML(
                            error.message ||
                            "Something went wrong."
                        )}
                    </p>
                </div>
            `;

        }

    });


    /* ==========================================
       LOAD ASSIGNMENTS
    ========================================== */

    async function loadAssignments() {

        assignmentContainer.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                Loading assignments...
            </div>
        `;


        try {

            const assignmentsRef =
                collection(db, "assignments");


            const assignmentQuery =
                query(
                    assignmentsRef,
                    where(
                        "studentId",
                        "==",
                        currentUser.uid
                    )
                );


            const snapshot =
                await getDocs(assignmentQuery);


            assignments = [];


            snapshot.forEach((item) => {

                assignments.push({
                    id: item.id,
                    ...item.data()
                });

            });


            /*
             * Sort newest / nearest due date first.
             * Client-side sorting avoids unnecessary
             * Firestore composite indexes.
             */

            assignments.sort((a, b) => {

                const dateA =
                    parseDueDate(a.dueDate);

                const dateB =
                    parseDueDate(b.dueDate);


                if (!dateA && !dateB) {
                    return 0;
                }

                if (!dateA) {
                    return 1;
                }

                if (!dateB) {
                    return -1;
                }

                return dateA - dateB;

            });


            updateStats();

            displayAssignments();

        }
        catch (error) {

            console.error(
                "Assignment loading error:",
                error
            );


            assignmentContainer.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">⚠️</div>

                    <h3>Unable to load assignments</h3>

                    <p>
                        ${escapeHTML(
                            error.message ||
                            "Please try again."
                        )}
                    </p>
                </div>
            `;

            resetStats();

        }

    }


    /* ==========================================
       DISPLAY ASSIGNMENTS
    ========================================== */

    function displayAssignments() {

        if (assignments.length === 0) {

            assignmentContainer.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">📚</div>

                    <h3>No Assignments Yet</h3>

                    <p>
                        Your faculty has not assigned
                        any assignments to you yet.
                    </p>

                </div>
            `;

            return;
        }


        const html =
            assignments.map((assignment) => {

                const title =
                    assignment.title ||
                    "Untitled Assignment";


                const subject =
                    assignment.subject ||
                    "General";


                const description =
                    assignment.description ||
                    "No description provided.";


                const facultyName =
                    assignment.facultyName ||
                    "Faculty";


                const dueDate =
                    parseDueDate(
                        assignment.dueDate
                    );


                const status =
                    getAssignmentStatus(
                        assignment.dueDate
                    );


                return `
                    <div class="assignment-card">

                        <div class="assignment-top">

                            <div>

                                <div class="assignment-title">
                                    ${escapeHTML(title)}
                                </div>

                                <div class="subject">
                                    📖 ${escapeHTML(subject)}
                                </div>

                            </div>

                            <span class="status ${status.className}">
                                ${status.label}
                            </span>

                        </div>


                        <div class="description">
                            ${escapeHTML(
                                truncateText(
                                    description,
                                    160
                                )
                            )}
                        </div>


                        <div class="assignment-info">

                            <div class="info-row">
                                👨‍🏫
                                <span>
                                    Faculty:
                                    <strong>
                                        ${escapeHTML(facultyName)}
                                    </strong>
                                </span>
                            </div>


                            <div class="info-row">
                                📅
                                <span>
                                    Due:
                                    <strong>
                                        ${
                                            dueDate
                                            ? formatDate(dueDate)
                                            : "No Due Date"
                                        }
                                    </strong>
                                </span>
                            </div>

                        </div>


                        <button
                            class="view-btn"
                            data-id="${escapeHTML(assignment.id)}"
                        >
                            🔍 View Assignment
                        </button>

                    </div>
                `;

            }).join("");


        assignmentContainer.innerHTML =
            `<div class="assignment-grid">${html}</div>`;


        document
            .querySelectorAll(".view-btn")
            .forEach((button) => {

                button.addEventListener(
                    "click",
                    () => {

                        const id =
                            button.dataset.id;

                        openAssignment(id);

                    }
                );

            });

    }


    /* ==========================================
       UPDATE STATISTICS
    ========================================== */

    function updateStats() {

        let pending = 0;
        let today = 0;
        let overdue = 0;


        assignments.forEach((assignment) => {

            const status =
                getAssignmentStatus(
                    assignment.dueDate
                );


            if (status.type === "pending") {
                pending++;
            }

            if (status.type === "today") {
                today++;
            }

            if (status.type === "overdue") {
                overdue++;
            }

        });


        totalAssignments.textContent =
            assignments.length;

        pendingAssignments.textContent =
            pending;

        todayAssignments.textContent =
            today;

        overdueAssignments.textContent =
            overdue;

    }


    function resetStats() {

        totalAssignments.textContent = "0";
        pendingAssignments.textContent = "0";
        todayAssignments.textContent = "0";
        overdueAssignments.textContent = "0";

    }


    /* ==========================================
       ASSIGNMENT STATUS
    ========================================== */

    function getAssignmentStatus(dueDateValue) {

        const dueDate =
            parseDueDate(dueDateValue);


        if (!dueDate) {

            return {
                type: "none",
                label: "No Due Date",
                className: "no-date"
            };

        }


        const today =
            new Date();


        today.setHours(
            0,
            0,
            0,
            0
        );


        const due =
            new Date(dueDate);


        due.setHours(
            0,
            0,
            0,
            0
        );


        if (due.getTime() < today.getTime()) {

            return {
                type: "overdue",
                label: "Overdue",
                className: "overdue"
            };

        }


        if (due.getTime() === today.getTime()) {

            return {
                type: "today",
                label: "Due Today",
                className: "today"
            };

        }


        return {
            type: "pending",
            label: "Pending",
            className: "pending"
        };

    }


    /* ==========================================
       OPEN ASSIGNMENT
    ========================================== */

    function openAssignment(id) {

        const assignment =
            assignments.find(
                item => item.id === id
            );


        if (!assignment) {

            showToast(
                "Assignment not found."
            );

            return;
        }


        const status =
            getAssignmentStatus(
                assignment.dueDate
            );


        const dueDate =
            parseDueDate(
                assignment.dueDate
            );


        document.getElementById(
            "modalTitle"
        ).textContent =
            assignment.title ||
            "Untitled Assignment";


        document.getElementById(
            "modalSubject"
        ).textContent =
            assignment.subject ||
            "General";


        document.getElementById(
            "modalFaculty"
        ).textContent =
            assignment.facultyName ||
            "Faculty";


        document.getElementById(
            "modalDueDate"
        ).textContent =
            dueDate
                ? formatDate(dueDate)
                : "No Due Date";


        document.getElementById(
            "modalStatus"
        ).textContent =
            status.label;


        document.getElementById(
            "modalDescription"
        ).textContent =
            assignment.description ||
            "No description provided.";


        modal.classList.add("show");

    }


    /* ==========================================
       CLOSE MODAL
    ========================================== */

    closeModal.addEventListener(
        "click",
        () => {

            modal.classList.remove("show");

        }
    );


    modal.addEventListener(
        "click",
        (event) => {

            if (event.target === modal) {

                modal.classList.remove(
                    "show"
                );

            }

        }
    );


    /* ==========================================
       REFRESH
    ========================================== */

    refreshBtn.addEventListener(
        "click",
        async () => {

            refreshBtn.disabled = true;

            refreshBtn.textContent =
                "⏳ Loading...";


            await loadAssignments();


            refreshBtn.disabled = false;

            refreshBtn.textContent =
                "🔄 Refresh";

        }
    );


    /* ==========================================
       LOGOUT
    ========================================== */

    logoutBtn.addEventListener(
        "click",
        async () => {

            try {

                await signOut(auth);

                window.location.href =
                    "login.html";

            }
            catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

                showToast(
                    "Unable to logout."
                );

            }

        }
    );


    /* ==========================================
       DATE PARSER
    ========================================== */

    function parseDueDate(value) {

        if (!value) {
            return null;
        }


        /*
         * Firestore Timestamp
         */

        if (
            typeof value === "object" &&
            typeof value.toDate === "function"
        ) {

            return value.toDate();

        }


        /*
         * JavaScript Date
         */

        if (value instanceof Date) {

            return value;

        }


        /*
         * String YYYY-MM-DD
         */

        if (typeof value === "string") {

            const trimmed =
                value.trim();


            if (!trimmed) {
                return null;
            }


            /*
             * Handle YYYY-MM-DD safely
             */

            if (
                /^\d{4}-\d{2}-\d{2}$/
                    .test(trimmed)
            ) {

                const parts =
                    trimmed.split("-");


                return new Date(
                    Number(parts[0]),
                    Number(parts[1]) - 1,
                    Number(parts[2])
                );

            }


            const parsed =
                new Date(trimmed);


            if (!isNaN(parsed.getTime())) {

                return parsed;

            }

        }


        /*
         * Timestamp-like object
         */

        if (
            typeof value === "object" &&
            value.seconds
        ) {

            return new Date(
                Number(value.seconds) * 1000
            );

        }


        return null;

    }


    /* ==========================================
       FORMAT DATE
    ========================================== */

    function formatDate(date) {

        if (!date) {
            return "No Due Date";
        }


        return date.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );

    }


    /* ==========================================
       TRUNCATE TEXT
    ========================================== */

    function truncateText(
        text,
        maxLength
    ) {

        if (!text) {
            return "";
        }


        text =
            String(text);


        if (
            text.length <= maxLength
        ) {

            return text;

        }


        return (
            text.substring(
                0,
                maxLength
            ) + "..."
        );

    }


    /* ==========================================
       ESCAPE HTML
    ========================================== */

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* ==========================================
       TOAST
    ========================================== */

    let toastTimer;


    function showToast(message) {

        const toast =
            document.getElementById(
                "toast"
            );


        toast.textContent =
            message;


        toast.classList.add(
            "show"
        );


        clearTimeout(
            toastTimer
        );


        toastTimer =
            setTimeout(
                () => {

                    toast.classList.remove(
                        "show"
                    );

                },
                3000
            );

    }

</script>
