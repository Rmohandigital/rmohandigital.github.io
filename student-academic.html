<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Academic Records | R Mohan Digital</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #020617;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* ================================
           HEADER
        ================================ */

        header {
            min-height: 75px;
            padding: 15px 5%;
            background: #07111f;
            border-bottom: 1px solid #12304d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .logo {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: #00e5ff;
            color: #00131a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .brand h2 {
            color: #00e5ff;
            font-size: 18px;
        }

        .brand small {
            color: #94a3b8;
            font-size: 11px;
        }

        .back-btn {
            border: 1px solid #164e63;
            background: #07111f;
            color: #67e8f9;
            padding: 10px 17px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .back-btn:hover {
            background: #0c2638;
        }


        /* ================================
           CONTAINER
        ================================ */

        .container {
            width: min(1150px, 92%);
            margin: auto;
            padding: 35px 0 60px;
        }


        /* ================================
           MESSAGE
        ================================ */

        .message {
            display: none;
            padding: 15px 18px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #7f1d1d;
            background: #2a0d0d;
            color: #fca5a5;
        }


        /* ================================
           STUDENT HEADER
        ================================ */

        .student-header {
            background: #07111f;
            border: 1px solid #12304d;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #0c2638;
            border: 2px solid #00e5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .student-info {
            flex: 1;
        }

        .student-info h1 {
            color: #f8fafc;
            font-size: 25px;
            margin-bottom: 7px;
        }

        .student-info p {
            color: #94a3b8;
            font-size: 13px;
            margin: 4px 0;
        }

        .student-course {
            color: #67e8f9 !important;
            font-weight: 700;
        }


        /* ================================
           CARDS
        ================================ */

        .card {
            background: #07111f;
            border: 1px solid #12304d;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .card-header h2 {
            color: #00e5ff;
            font-size: 20px;
        }

        .count {
            background: #0c2638;
            color: #67e8f9;
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
        }


        /* ================================
           FORMS
        ================================ */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 7px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            padding: 12px 13px;
            border-radius: 9px;
            border: 1px solid #1e3a56;
            background: #020b15;
            color: #e2e8f0;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 0 2px rgba(0,229,255,.08);
        }

        select option {
            background: #07111f;
            color: white;
        }


        /* ================================
           BUTTONS
        ================================ */

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 17px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 11px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 800;
            font-size: 13px;
        }

        .btn-primary {
            background: #00e5ff;
            color: #00131a;
        }

        .btn-primary:hover {
            background: #67e8f9;
        }

        .btn-secondary {
            background: #172033;
            color: #cbd5e1;
            border: 1px solid #334155;
        }

        .btn-danger {
            background: #3f1111;
            color: #fca5a5;
            border: 1px solid #7f1d1d;
        }

        .btn-danger:hover {
            background: #5b1515;
        }

        .btn-edit {
            background: #0c2638;
            color: #67e8f9;
            border: 1px solid #155e75;
        }


        /* ================================
           RECORDS
        ================================ */

        .records {
            display: grid;
            gap: 11px;
            margin-top: 25px;
        }

        .record {
            background: #020b15;
            border: 1px solid #12304d;
            border-radius: 12px;
            padding: 16px;
        }

        .record-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
        }

        .record h3 {
            color: #f8fafc;
            font-size: 15px;
            margin-bottom: 7px;
        }

        .record p {
            color: #94a3b8;
            font-size: 12px;
            margin: 4px 0;
        }

        .record-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .small-btn {
            padding: 7px 11px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid #334155;
            background: #172033;
            color: #cbd5e1;
        }

        .small-btn.edit {
            color: #67e8f9;
            border-color: #155e75;
            background: #0c2638;
        }

        .small-btn.delete {
            color: #fca5a5;
            border-color: #7f1d1d;
            background: #2a0d0d;
        }


        /* ================================
           STATUS
        ================================ */

        .status-present {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 20px;
            background: #052e1b;
            color: #86efac;
            font-size: 11px;
            font-weight: 800;
        }

        .status-absent {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 20px;
            background: #3b0b0b;
            color: #fca5a5;
            font-size: 11px;
            font-weight: 800;
        }


        /* ================================
           EMPTY
        ================================ */

        .empty {
            text-align: center;
            padding: 25px;
            color: #64748b;
            background: #020b15;
            border-radius: 10px;
            border: 1px dashed #1e3a56;
        }


        /* ================================
           LOADING
        ================================ */

        .loading {
            text-align: center;
            padding: 30px;
            color: #67e8f9;
        }


        /* ================================
           RESPONSIVE
        ================================ */

        @media(max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .student-header {
                flex-direction: column;
                text-align: center;
            }

            .record-top {
                flex-direction: column;
            }

            .record-actions {
                width: 100%;
            }

            .small-btn {
                flex: 1;
            }

            header {
                padding: 12px 4%;
            }

            .brand h2 {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="brand">

        <div class="logo">
            RM
        </div>

        <div>

            <h2>
                R Mohan Digital
            </h2>

            <small>
                Faculty Academic Management
            </small>

        </div>

    </div>


    <button
        class="back-btn"
        id="backBtn">

        ← Back to Student

    </button>

</header>



<main class="container">


    <div
        class="message"
        id="message">
    </div>



    <!-- ==================================
         STUDENT
    =================================== -->

    <section class="student-header">


        <div
            class="avatar"
            id="studentAvatar">

            👤

        </div>


        <div class="student-info">

            <h1 id="studentName">
                Loading...
            </h1>

            <p id="studentEmail">
                Loading...
            </p>

            <p
                class="student-course"
                id="studentCourse">

                Course: Loading...

            </p>

            <p id="studentStatus">
                Status: Loading...

            </p>

        </div>

    </section>



    <!-- ==================================
         ATTENDANCE
    =================================== -->

    <section class="card">

        <div class="card-header">

            <h2>
                📊 Attendance Management
            </h2>

            <span
                class="count"
                id="attendanceCount">

                0 Records

            </span>

        </div>


        <form id="attendanceForm">


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Date
                    </label>

                    <input
                        type="date"
                        id="attendanceDate"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Subject
                    </label>

                    <input
                        type="text"
                        id="attendanceSubject"
                        placeholder="Example: Mathematics"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Attendance Status
                    </label>

                    <select
                        id="attendanceStatus"
                        required>

                        <option value="Present">
                            Present
                        </option>

                        <option value="Absent">
                            Absent
                        </option>

                    </select>

                </div>

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="attendanceSaveBtn">

                    Add Attendance

                </button>


                <button
                    type="button"
                    class="btn btn-secondary"
                    id="attendanceCancelBtn"
                    style="display:none;">

                    Cancel Edit

                </button>

            </div>

        </form>


        <div
            class="records"
            id="attendanceRecords">

            <div class="loading">
                Loading attendance...
            </div>

        </div>

    </section>



    <!-- ==================================
         MARKS
    =================================== -->

    <section class="card">

        <div class="card-header">

            <h2>
                📝 Marks Management
            </h2>

            <span
                class="count"
                id="marksCount">

                0 Records

            </span>

        </div>


        <form id="marksForm">


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Subject
                    </label>

                    <input
                        type="text"
                        id="marksSubject"
                        placeholder="Example: Programming"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Exam / Test
                    </label>

                    <input
                        type="text"
                        id="marksExam"
                        placeholder="Example: Mid 1"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Marks Obtained
                    </label>

                    <input
                        type="number"
                        id="marksObtained"
                        min="0"
                        step="0.01"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Maximum Marks
                    </label>

                    <input
                        type="number"
                        id="maxMarks"
                        min="1"
                        step="0.01"
                        value="100"
                        required>

                </div>

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="marksSaveBtn">

                    Add Marks

                </button>


                <button
                    type="button"
                    class="btn btn-secondary"
                    id="marksCancelBtn"
                    style="display:none;">

                    Cancel Edit

                </button>

            </div>

        </form>


        <div
            class="records"
            id="marksRecords">

            <div class="loading">
                Loading marks...
            </div>

        </div>

    </section>

</main>



<script type="module">


    /* =====================================
       FIREBASE
    ===================================== */

    import {
        auth,
        db
    } from "./firebase.js";


    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    import {
        doc,
        getDoc,
        collection,
        query,
        where,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";



    /* =====================================
       ELEMENTS
    ===================================== */

    const message =
        document.getElementById("message");


    const studentName =
        document.getElementById("studentName");


    const studentEmail =
        document.getElementById("studentEmail");


    const studentCourse =
        document.getElementById("studentCourse");


    const studentStatus =
        document.getElementById("studentStatus");


    const studentAvatar =
        document.getElementById("studentAvatar");


    const attendanceForm =
        document.getElementById("attendanceForm");


    const attendanceDate =
        document.getElementById("attendanceDate");


    const attendanceSubject =
        document.getElementById("attendanceSubject");


    const attendanceStatus =
        document.getElementById("attendanceStatus");


    const attendanceSaveBtn =
        document.getElementById("attendanceSaveBtn");


    const attendanceCancelBtn =
        document.getElementById("attendanceCancelBtn");


    const attendanceRecords =
        document.getElementById("attendanceRecords");


    const attendanceCount =
        document.getElementById("attendanceCount");


    const marksForm =
        document.getElementById("marksForm");


    const marksSubject =
        document.getElementById("marksSubject");


    const marksExam =
        document.getElementById("marksExam");


    const marksObtained =
        document.getElementById("marksObtained");


    const maxMarks =
        document.getElementById("maxMarks");


    const marksSaveBtn =
        document.getElementById("marksSaveBtn");


    const marksCancelBtn =
        document.getElementById("marksCancelBtn");


    const marksRecords =
        document.getElementById("marksRecords");


    const marksCount =
        document.getElementById("marksCount");


    const backBtn =
        document.getElementById("backBtn");



    /* =====================================
       VARIABLES
    ===================================== */

    let currentFaculty = null;

    let studentId = null;

    let editingAttendanceId = null;

    let editingMarksId = null;



    /* =====================================
       GET STUDENT ID
    ===================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );


    studentId =
        params.get("id");



    /* =====================================
       ESCAPE HTML
    ===================================== */

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }



    /* =====================================
       MESSAGE
    ===================================== */

    function showMessage(text) {

        message.textContent =
            text;

        message.style.display =
            "block";

    }


    function hideMessage() {

        message.style.display =
            "none";

    }



    /* =====================================
       DATE FORMAT
    ===================================== */

    function formatDate(value) {

        if (!value) {

            return "Date not available";

        }


        try {

            if (
                typeof value.toDate ===
                "function"
            ) {

                return value
                    .toDate()
                    .toLocaleDateString(
                        "en-IN"
                    );

            }


            return new Date(value)
                .toLocaleDateString(
                    "en-IN"
                );

        }

        catch {

            return String(value);

        }

    }



    /* =====================================
       LOAD STUDENT
    ===================================== */

    async function loadStudent() {

        if (!studentId) {

            showMessage(
                "Student ID is missing from the URL."
            );

            return false;

        }


        try {

            const studentRef =
                doc(
                    db,
                    "users",
                    studentId
                );


            const studentSnap =
                await getDoc(
                    studentRef
                );


            if (!studentSnap.exists()) {

                showMessage(
                    "Student profile not found."
                );

                return false;

            }


            const data =
                studentSnap.data();


            const role =
                String(
                    data.role || ""
                ).toLowerCase();


            if (role !== "student") {

                showMessage(
                    "The selected account is not a student."
                );

                return false;

            }


            const assignedFaculty =
                data.facultyId || "";


            if (
                assignedFaculty !==
                currentFaculty.uid
            ) {

                showMessage(
                    "This student is not assigned to your faculty account."
                );

                return false;

            }


            studentName.textContent =
                data.name ||
                "Student";


            studentEmail.textContent =
                data.email ||
                "No email";


            studentCourse.textContent =
                "Course: " +
                (
                    data.course ||
                    "Not selected"
                );


            studentStatus.textContent =
                "Status: " +
                (
                    data.status ||
                    "Unknown"
                );


            if (data.photoURL) {

                studentAvatar.innerHTML = `

                    <img
                        src="${escapeHTML(data.photoURL)}"
                        alt="Student">

                `;

            }


            return true;

        }

        catch (error) {

            console.error(
                "Student loading error:",
                error
            );

            showMessage(
                "Unable to load student profile."
            );

            return false;

        }

    }



    /* =====================================
       LOAD ATTENDANCE
    ===================================== */

    async function loadAttendance() {

        attendanceRecords.innerHTML =
            `<div class="loading">
                Loading attendance...
             </div>`;


        try {

            const q =
                query(
                    collection(
                        db,
                        "attendance"
                    ),
                    where(
                        "studentId",
                        "==",
                        studentId
                    ),
                    where(
                        "facultyId",
                        "==",
                        currentFaculty.uid
                    )
                );


            const snapshot =
                await getDocs(q);


            attendanceCount.textContent =
                snapshot.size +
                " Records";


            if (snapshot.empty) {

                attendanceRecords.innerHTML =
                    `<div class="empty">
                        No attendance records yet.
                     </div>`;

                return;

            }


            const records = [];


            snapshot.forEach(item => {

                records.push({

                    id: item.id,

                    data: item.data()

                });

            });


            records.sort(
                (a, b) => {

                    const dateA =
                        String(
                            a.data.date || ""
                        );

                    const dateB =
                        String(
                            b.data.date || ""
                        );

                    return dateB.localeCompare(
                        dateA
                    );

                }
            );


            attendanceRecords.innerHTML =
                "";


            records.forEach(record => {

                const data =
                    record.data;


                const subject =
                    data.subject ||
                    "Subject";


                const date =
                    data.date ||
                    "No date";


                const status =
                    String(
                        data.status ||
                        "Absent"
                    );


                const statusLower =
                    status.toLowerCase();


                const statusClass =
                    statusLower === "present"
                        ? "status-present"
                        : "status-absent";


                attendanceRecords.innerHTML += `

                    <div class="record">

                        <div class="record-top">

                            <div>

                                <h3>
                                    ${escapeHTML(subject)}
                                </h3>

                                <p>
                                    Date:
                                    ${escapeHTML(date)}
                                </p>

                                <p>

                                    <span
                                        class="${statusClass}">

                                        ${escapeHTML(status)}

                                    </span>

                                </p>

                            </div>


                            <div class="record-actions">

                                <button
                                    class="small-btn edit"
                                    data-action="edit-attendance"
                                    data-id="${record.id}">

                                    ✏️ Edit

                                </button>


                                <button
                                    class="small-btn delete"
                                    data-action="delete-attendance"
                                    data-id="${record.id}">

                                    🗑️ Delete

                                </button>

                            </div>

                        </div>

                    </div>

                `;

            });

        }

        catch (error) {

            console.error(
                "Attendance load error:",
                error
            );

            attendanceRecords.innerHTML =
                `<div class="empty">
                    Unable to load attendance.
                 </div>`;

        }

    }



    /* =====================================
       LOAD MARKS
    ===================================== */

    async function loadMarks() {

        marksRecords.innerHTML =
            `<div class="loading">
                Loading marks...
             </div>`;


        try {

            const q =
                query(
                    collection(
                        db,
                        "marks"
                    ),
                    where(
                        "studentId",
                        "==",
                        studentId
                    ),
                    where(
                        "facultyId",
                        "==",
                        currentFaculty.uid
                    )
                );


            const snapshot =
                await getDocs(q);


            marksCount.textContent =
                snapshot.size +
                " Records";


            if (snapshot.empty) {

                marksRecords.innerHTML =
                    `<div class="empty">
                        No marks records yet.
                     </div>`;

                return;

            }


            const records = [];


            snapshot.forEach(item => {

                records.push({

                    id: item.id,

                    data: item.data()

                });

            });


            records.sort(
                (a, b) => {

                    const aDate =
                        a.data.createdAt;

                    const bDate =
                        b.data.createdAt;


                    if (
                        aDate &&
                        bDate &&
                        typeof aDate.toMillis ===
                        "function" &&
                        typeof bDate.toMillis ===
                        "function"
                    ) {

                        return (
                            bDate.toMillis() -
                            aDate.toMillis()
                        );

                    }


                    return 0;

                }
            );


            marksRecords.innerHTML =
                "";


            records.forEach(record => {

                const data =
                    record.data;


                const subject =
                    data.subject ||
                    "Subject";


                const exam =
                    data.exam ||
                    "Exam";


                const obtained =
                    Number(
                        data.marks ??
                        data.mark ??
                        data.score ??
                        0
                    );


                const maximum =
                    Number(
                        data.maxMarks ??
                        data.total ??
                        100
                    );


                const percentage =
                    maximum > 0
                        ? Math.round(
                            (
                                obtained /
                                maximum
                            ) * 100
                        )
                        : 0;


                marksRecords.innerHTML += `

                    <div class="record">

                        <div class="record-top">

                            <div>

                                <h3>
                                    ${escapeHTML(subject)}
                                </h3>

                                <p>
                                    Exam:
                                    ${escapeHTML(exam)}
                                </p>

                                <p>
                                    Marks:
                                    <strong>
                                        ${obtained}
                                        /
                                        ${maximum}
                                    </strong>
                                </p>

                                <p>
                                    Percentage:
                                    <strong>
                                        ${percentage}%
                                    </strong>
                                </p>

                            </div>


                            <div class="record-actions">

                                <button
                                    class="small-btn edit"
                                    data-action="edit-marks"
                                    data-id="${record.id}">

                                    ✏️ Edit

                                </button>


                                <button
                                    class="small-btn delete"
                                    data-action="delete-marks"
                                    data-id="${record.id}">

                                    🗑️ Delete

                                </button>

                            </div>

                        </div>

                    </div>

                `;

            });

        }

        catch (error) {

            console.error(
                "Marks load error:",
                error
            );

            marksRecords.innerHTML =
                `<div class="empty">
                    Unable to load marks.
                 </div>`;

        }

    }



    /* =====================================
       RESET ATTENDANCE FORM
    ===================================== */

    function resetAttendanceForm() {

        editingAttendanceId =
            null;


        attendanceForm.reset();


        attendanceStatus.value =
            "Present";


        attendanceSaveBtn.textContent =
            "Add Attendance";


        attendanceCancelBtn.style.display =
            "none";

    }



    /* =====================================
       RESET MARKS FORM
    ===================================== */

    function resetMarksForm() {

        editingMarksId =
            null;


        marksForm.reset();


        maxMarks.value =
            "100";


        marksSaveBtn.textContent =
            "Add Marks";


        marksCancelBtn.style.display =
            "none";

    }



    /* =====================================
       ADD / UPDATE ATTENDANCE
    ===================================== */

    attendanceForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            hideMessage();


            const date =
                attendanceDate.value.trim();


            const subject =
                attendanceSubject.value.trim();


            const status =
                attendanceStatus.value;


            if (!date || !subject) {

                showMessage(
                    "Please enter date and subject."
                );

                return;

            }


            attendanceSaveBtn.disabled =
                true;


            attendanceSaveBtn.textContent =
                "Saving...";


            try {

                const recordData = {

                    studentId:
                        studentId,

                    facultyId:
                        currentFaculty.uid,

                    subject:
                        subject,

                    date:
                        date,

                    status:
                        status,

                    updatedAt:
                        serverTimestamp()

                };


                /* =========================
                   UPDATE
                ========================= */

                if (editingAttendanceId) {

                    await updateDoc(

                        doc(
                            db,
                            "attendance",
                            editingAttendanceId
                        ),

                        recordData

                    );

                }


                /* =========================
                   ADD
                ========================= */

                else {

                    recordData.createdAt =
                        serverTimestamp();


                    await addDoc(

                        collection(
                            db,
                            "attendance"
                        ),

                        recordData

                    );

                }


                resetAttendanceForm();


                await loadAttendance();

            }

            catch (error) {

                console.error(
                    "Attendance save error:",
                    error
                );

                showMessage(
                    "Unable to save attendance. Please check Firestore rules."
                );

            }

            finally {

                attendanceSaveBtn.disabled =
                    false;

                if (!editingAttendanceId) {

                    attendanceSaveBtn.textContent =
                        "Add Attendance";

                }

            }

        }
    );



    /* =====================================
       EDIT ATTENDANCE
    ===================================== */

    async function editAttendance(id) {

        try {

            const recordRef =
                doc(
                    db,
                    "attendance",
                    id
                );


            const recordSnap =
                await getDoc(
                    recordRef
                );


            if (!recordSnap.exists()) {

                showMessage(
                    "Attendance record no longer exists."
                );

                await loadAttendance();

                return;

            }


            const data =
                recordSnap.data();


            if (
                data.studentId !==
                studentId ||
                data.facultyId !==
                currentFaculty.uid
            ) {

                showMessage(
                    "You cannot edit this attendance record."
                );

                return;

            }


            editingAttendanceId =
                id;


            attendanceDate.value =
                data.date || "";


            attendanceSubject.value =
                data.subject || "";


            attendanceStatus.value =
                data.status || "Present";


            attendanceSaveBtn.textContent =
                "Update Attendance";


            attendanceCancelBtn.style.display =
                "inline-block";


            attendanceForm.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        }

        catch (error) {

            console.error(
                "Edit attendance error:",
                error
            );

            showMessage(
                "Unable to edit attendance."
            );

        }

    }



    /* =====================================
       DELETE ATTENDANCE
    ===================================== */

    async function deleteAttendance(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this attendance record?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const recordRef =
                doc(
                    db,
                    "attendance",
                    id
                );


            const recordSnap =
                await getDoc(
                    recordRef
                );


            if (!recordSnap.exists()) {

                await loadAttendance();

                return;

            }


            const data =
                recordSnap.data();


            if (
                data.studentId !==
                studentId ||
                data.facultyId !==
                currentFaculty.uid
            ) {

                showMessage(
                    "You cannot delete this attendance record."
                );

                return;

            }


            await deleteDoc(
                recordRef
            );


            if (
                editingAttendanceId ===
                id
            ) {

                resetAttendanceForm();

            }


            await loadAttendance();

        }

        catch (error) {

            console.error(
                "Delete attendance error:",
                error
            );

            showMessage(
                "Unable to delete attendance. Check Firestore rules."
            );

        }

    }



    /* =====================================
       ATTENDANCE BUTTON EVENTS
    ===================================== */

    attendanceRecords.addEventListener(
        "click",
        async event => {

            const button =
                event.target.closest(
                    "button"
                );


            if (!button) {

                return;

            }


            const action =
                button.dataset.action;


            const id =
                button.dataset.id;


            if (
                action ===
                "edit-attendance"
            ) {

                await editAttendance(
                    id
                );

            }


            if (
                action ===
                "delete-attendance"
            ) {

                await deleteAttendance(
                    id
                );

            }

        }
    );



    /* =====================================
       CANCEL ATTENDANCE
    ===================================== */

    attendanceCancelBtn.addEventListener(
        "click",
        () => {

            resetAttendanceForm();

        }
    );



    /* =====================================
       ADD / UPDATE MARKS
    ===================================== */

    marksForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            hideMessage();


            const subject =
                marksSubject.value.trim();


            const exam =
                marksExam.value.trim();


            const obtained =
                Number(
                    marksObtained.value
                );


            const maximum =
                Number(
                    maxMarks.value
                );


            if (!subject || !exam) {

                showMessage(
                    "Please enter subject and exam name."
                );

                return;

            }


            if (
                Number.isNaN(obtained) ||
                Number.isNaN(maximum)
            ) {

                showMessage(
                    "Please enter valid marks."
                );

                return;

            }


            if (obtained < 0) {

                showMessage(
                    "Marks cannot be negative."
                );

                return;

            }


            if (maximum <= 0) {

                showMessage(
                    "Maximum marks must be greater than 0."
                );

                return;

            }


            if (obtained > maximum) {

                showMessage(
                    "Obtained marks cannot be greater than maximum marks."
                );

                return;

            }


            marksSaveBtn.disabled =
                true;


            marksSaveBtn.textContent =
                "Saving...";


            try {

                const recordData = {

                    studentId:
                        studentId,

                    facultyId:
                        currentFaculty.uid,

                    subject:
                        subject,

                    exam:
                        exam,

                    marks:
                        obtained,

                    maxMarks:
                        maximum,

                    updatedAt:
                        serverTimestamp()

                };


                /* =========================
                   UPDATE
                ========================= */

                if (editingMarksId) {

                    await updateDoc(

                        doc(
                            db,
                            "marks",
                            editingMarksId
                        ),

                        recordData

                    );

                }


                /* =========================
                   ADD
                ========================= */

                else {

                    recordData.createdAt =
                        serverTimestamp();


                    await addDoc(

                        collection(
                            db,
                            "marks"
                        ),

                        recordData

                    );

                }


                resetMarksForm();


                await loadMarks();

            }

            catch (error) {

                console.error(
                    "Marks save error:",
                    error
                );

                showMessage(
                    "Unable to save marks. Please check Firestore rules."
                );

            }

            finally {

                marksSaveBtn.disabled =
                    false;

                if (!editingMarksId) {

                    marksSaveBtn.textContent =
                        "Add Marks";

                }

            }

        }
    );



    /* =====================================
       EDIT MARKS
    ===================================== */

    async function editMarks(id) {

        try {

            const recordRef =
                doc(
                    db,
                    "marks",
                    id
                );


            const recordSnap =
                await getDoc(
                    recordRef
                );


            if (!recordSnap.exists()) {

                showMessage(
                    "Marks record no longer exists."
                );

                await loadMarks();

                return;

            }


            const data =
                recordSnap.data();


            if (
                data.studentId !==
                studentId ||
                data.facultyId !==
                currentFaculty.uid
            ) {

                showMessage(
                    "You cannot edit this marks record."
                );

                return;

            }


            editingMarksId =
                id;


            marksSubject.value =
                data.subject || "";


            marksExam.value =
                data.exam || "";


            marksObtained.value =
                data.marks ??
                data.mark ??
                data.score ??
                "";


            maxMarks.value =
                data.maxMarks ??
                data.total ??
                100;


            marksSaveBtn.textContent =
                "Update Marks";


            marksCancelBtn.style.display =
                "inline-block";


            marksForm.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        }

        catch (error) {

            console.error(
                "Edit marks error:",
                error
            );

            showMessage(
                "Unable to edit marks."
            );

        }

    }



    /* =====================================
       DELETE MARKS
    ===================================== */

    async function deleteMarks(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this marks record?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const recordRef =
                doc(
                    db,
                    "marks",
                    id
                );


            const recordSnap =
                await getDoc(
                    recordRef
                );


            if (!recordSnap.exists()) {

                await loadMarks();

                return;

            }


            const data =
                recordSnap.data();


            if (
                data.studentId !==
                studentId ||
                data.facultyId !==
                currentFaculty.uid
            ) {

                showMessage(
                    "You cannot delete this marks record."
                );

                return;

            }


            await deleteDoc(
                recordRef
            );


            if (
                editingMarksId ===
                id
            ) {

                resetMarksForm();

            }


            await loadMarks();

        }

        catch (error) {

            console.error(
                "Delete marks error:",
                error
            );

            showMessage(
                "Unable to delete marks. Check Firestore rules."
            );

        }

    }



    /* =====================================
       MARKS BUTTON EVENTS
    ===================================== */

    marksRecords.addEventListener(
        "click",
        async event => {

            const button =
                event.target.closest(
                    "button"
                );


            if (!button) {

                return;

            }


            const action =
                button.dataset.action;


            const id =
                button.dataset.id;


            if (
                action ===
                "edit-marks"
            ) {

                await editMarks(
                    id
                );

            }


            if (
                action ===
                "delete-marks"
            ) {

                await deleteMarks(
                    id
                );

            }

        }
    );



    /* =====================================
       CANCEL MARKS
    ===================================== */

    marksCancelBtn.addEventListener(
        "click",
        () => {

            resetMarksForm();

        }
    );



    /* =====================================
       BACK BUTTON
    ===================================== */

    backBtn.addEventListener(
        "click",
        () => {

            window.location.href =
                `student-profile.html?id=${encodeURIComponent(studentId)}`;

        }
    );



    /* =====================================
       AUTHENTICATION
    ===================================== */

    onAuthStateChanged(
        auth,
        async user => {

            if (!user) {

                window.location.href =
                    "login.html";

                return;

            }


            try {

                const facultyRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const facultySnap =
                    await getDoc(
                        facultyRef
                    );


                if (!facultySnap.exists()) {

                    showMessage(
                        "Faculty profile not found."
                    );

                    return;

                }


                const facultyData =
                    facultySnap.data();


                const role =
                    String(
                        facultyData.role || ""
                    ).toLowerCase();


                const status =
                    String(
                        facultyData.status || ""
                    ).toLowerCase();


                if (role !== "faculty") {

                    showMessage(
                        "Only faculty accounts can manage academic records."
                    );

                    return;

                }


                if (status !== "active") {

                    showMessage(
                        "Your faculty account is not active."
                    );

                    return;

                }


                currentFaculty = {

                    uid:
                        user.uid,

                    ...facultyData

                };


                const studentLoaded =
                    await loadStudent();


                if (!studentLoaded) {

                    return;

                }


                await Promise.all([

                    loadAttendance(),

                    loadMarks()

                ]);

            }

            catch (error) {

                console.error(
                    "Authentication error:",
                    error
                );

                showMessage(
                    "Unable to verify your faculty account."
                );

            }

        }
    );


</script>
