<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Chat | R Mohan Digital</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 260px;
    background: #091827;
    border-right: 1px solid #16344d;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    color: #38bdf8;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 30px;
}

.menu button,
.logout {
    width: 100%;
    padding: 13px;
    margin-bottom: 8px;
    border-radius: 9px;
    border: 1px solid transparent;
    background: transparent;
    color: white;
    text-align: left;
    cursor: pointer;
}

.menu button:hover,
.menu button.active {
    background: #102d46;
    color: #38bdf8;
    border-color: #1e567f;
}

.logout {
    margin-top: auto;
    background: #32151b;
    color: #ff8795;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 70px;
    background: #091827;
    border-bottom: 1px solid #16344d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
}

.profile {
    color: #8ba7bb;
}

.chat-container {
    flex: 1;
    display: flex;
    min-height: 0;
}

.chat-list {
    width: 330px;
    background: #081522;
    border-right: 1px solid #16344d;
    display: flex;
    flex-direction: column;
}

.search {
    padding: 15px;
    border-bottom: 1px solid #16344d;
}

.search-row {
    display: flex;
    gap: 7px;
    margin-top: 8px;
}

input {
    background: #0c2033;
    border: 1px solid #244963;
    border-radius: 9px;
    color: white;
    padding: 11px;
    outline: none;
}

input:focus {
    border-color: #38bdf8;
}

.phone {
    flex: 1;
}

button {
    cursor: pointer;
}

.primary {
    background: #0ea5e9;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 10px 14px;
}

.items {
    flex: 1;
    overflow-y: auto;
}

.item {
    padding: 15px;
    border-bottom: 1px solid #102c42;
    cursor: pointer;
}

.item:hover,
.item.active {
    background: #102d46;
}

.name {
    font-weight: bold;
}

.small {
    color: #7894a8;
    font-size: 12px;
    margin-top: 5px;
}

.chat-window {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 70px;
    background: #0a1c2d;
    border-bottom: 1px solid #163b55;
    display: flex;
    align-items: center;
    padding: 15px;
}

.header-name {
    font-weight: bold;
}

.header-phone {
    color: #7894a8;
    font-size: 12px;
    margin-top: 4px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    background:
        radial-gradient(circle, #0d2438, #07111f);
}

.empty {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #718a9e;
    text-align: center;
}

.message {
    display: flex;
    margin-bottom: 12px;
}

.message.me {
    justify-content: flex-end;
}

.bubble {
    max-width: 70%;
    background: #122c42;
    padding: 10px 13px;
    border-radius: 12px;
}

.me .bubble {
    background: #075985;
}

.sender {
    font-size: 11px;
    color: #38bdf8;
    margin-bottom: 5px;
}

.text {
    white-space: pre-wrap;
    word-break: break-word;
}

.info {
    font-size: 10px;
    color: #89a5b8;
    margin-top: 6px;
    display: flex;
    gap: 8px;
}

.delete {
    background: transparent;
    border: none;
    color: #ff8291;
}

.deleted {
    color: #8298a8;
    font-style: italic;
}

.composer {
    background: #091827;
    border-top: 1px solid #16344d;
    padding: 12px;
    display: flex;
    gap: 8px;
}

.message-input {
    flex: 1;
}

.send {
    width: 90px;
}

.back {
    display: none;
    margin-right: 10px;
}

@media(max-width:800px) {

    .sidebar {
        display: none;
    }

    .chat-list {
        width: 100%;
    }

    .chat-window {
        display: none;
    }

    .chat-container.open .chat-list {
        display: none;
    }

    .chat-container.open .chat-window {
        display: flex;
    }

    .back {
        display: block;
    }

}

</style>

</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">
        R MOHAN DIGITAL
    </div>

    <div class="menu">

        <button onclick="location.href='student-dashboard.html'">
            🏠 Dashboard
        </button>

        <button class="active">
            💬 Chat
        </button>

    </div>

    <button class="logout" id="logout">
        🚪 Logout
    </button>

</aside>


<main class="main">

<header class="topbar">

    <h2>💬 Student Chat</h2>

    <div
        class="profile"
        id="profile">
        Loading...
    </div>

</header>


<div
    class="chat-container"
    id="chatContainer">


    <aside class="chat-list">

        <div class="search">

            <div>
                Find faculty, mentor or owner
            </div>

            <div class="search-row">

                <input
                    id="phone"
                    class="phone"
                    placeholder="+91 9876543210">

                <button
                    class="primary"
                    id="search">
                    Chat
                </button>

            </div>

        </div>


        <div
            class="items"
            id="items">

            <div class="empty">
                Loading chats...
            </div>

        </div>

    </aside>


    <section class="chat-window">

        <div class="header">

            <button
                class="primary back"
                id="back">
                ←
            </button>

            <div>

                <div
                    class="header-name"
                    id="chatName">
                    Select a chat
                </div>

                <div
                    class="header-phone"
                    id="chatPhone">
                </div>

            </div>

        </div>


        <div
            class="messages"
            id="messages">

            <div class="empty">
                Select someone to start chatting.
            </div>

        </div>


        <form
            class="composer"
            id="form">

            <input
                id="message"
                class="message-input"
                placeholder="Type a message..."
                disabled
                autocomplete="off">

            <button
                class="primary send">
                Send
            </button>

        </form>

    </section>

</div>

</main>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
    collection,
    getDocs,
    doc,
    getDoc,
    setDoc,
    addDoc,
    updateDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


let user = null;
let profile = null;
let people = [];
let activeChat = null;
let stopMessages = null;


// ==========================================================
// HELPERS
// ==========================================================

function phoneKey(phone) {

    let d =
        String(phone || "")
        .replace(/\D/g, "");

    if (d.length > 10) {
        d = d.slice(-10);
    }

    return d;
}


function esc(value) {

    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


// ==========================================================
// AUTH
// ==========================================================

onAuthStateChanged(auth, async (current) => {

    if (!current) {

        location.href = "login.html";
        return;

    }

    user = current;

    await loadProfile();

    await loadPeople();

    await loadChats();

});


// ==========================================================
// PROFILE
// ==========================================================

async function loadProfile() {

    let snap =
        await getDoc(
            doc(db, "users", user.uid)
        );


    if (snap.exists()) {

        profile = snap.data();

    } else {

        snap =
            await getDoc(
                doc(db, "students", user.uid)
            );


        profile = snap.exists()
            ? snap.data()
            : {

                name:
                    user.displayName ||
                    user.email ||
                    "Student",

                phone: "",

                role: "student"

            };

    }


    document
        .getElementById("profile")
        .textContent =
        profile.name || "Student";

}


// ==========================================================
// PEOPLE
// ==========================================================

async function loadPeople() {

    people = [];

    const users =
        await getDocs(
            collection(db, "users")
        );


    users.forEach(item => {

        const d = item.data();

        if (!d.phone) return;

        people.push({

            authUid: item.id,

            name: d.name || "User",

            phone: d.phone,

            phoneKey: phoneKey(d.phone),

            role: d.role || "user"

        });

    });


    const students =
        await getDocs(
            collection(db, "students")
        );


    students.forEach(item => {

        const d = item.data();

        if (!d.phone) return;

        people.push({

            authUid:
                d.authUid ||
                d.uid ||
                d.userId ||
                null,

            name: d.name || "Student",

            phone: d.phone,

            phoneKey: phoneKey(d.phone),

            role: "student"

        });

    });

}


// ==========================================================
// SEARCH
// ==========================================================

document
.getElementById("search")
.addEventListener("click", async () => {

    const number =
        phoneKey(
            document.getElementById("phone").value
        );


    if (!number) {

        alert("Enter a phone number.");
        return;

    }


    const person =
        people.find(
            p => p.phoneKey === number
        );


    if (!person) {

        alert(
            "No account found with this phone number."
        );

        return;

    }


    if (!person.authUid) {

        alert(
            "This account is missing Firebase Auth UID."
        );

        return;

    }


    if (person.authUid === user.uid) {

        alert("You cannot chat with yourself.");
        return;

    }


    await createChat(person);

});


// ==========================================================
// CREATE CHAT
// ==========================================================

async function createChat(person) {

    const members =
        [user.uid, person.authUid]
        .sort();


    const id =
        "direct_" + members.join("_");


    const ref =
        doc(db, "directChats", id);


    const snap =
        await getDoc(ref);


    if (!snap.exists()) {

        await setDoc(ref, {

            memberUids: members,

            memberNames: {

                [user.uid]:
                    profile.name || "Student",

                [person.authUid]:
                    person.name

            },

            memberPhones: {

                [user.uid]:
                    profile.phone || "",

                [person.authUid]:
                    person.phone || ""

            },

            createdBy: user.uid,

            createdAt: serverTimestamp()

        });

    }


    openChat(

        id,

        person.name,

        person.phone,

        person.role

    );

}


// ==========================================================
// OPEN CHAT
// ==========================================================

function openChat(
    id,
    name,
    phone,
    role
) {

    activeChat = {

        id,
        name,
        phone,
        role

    };


    document
        .getElementById("chatName")
        .textContent = name;


    document
        .getElementById("chatPhone")
        .textContent =
        `${phone || ""} • ${role || ""}`;


    document
        .getElementById("message")
        .disabled = false;


    document
        .getElementById("chatContainer")
        .classList.add("open");


    listenMessages();

}


// ==========================================================
// LOAD CHAT LIST
// ==========================================================

async function loadChats() {

    const container =
        document.getElementById("items");


    const snap =
        await getDocs(
            collection(db, "directChats")
        );


    container.innerHTML = "";


    let count = 0;


    snap.forEach(item => {

        const d = item.data();


        if (!d.memberUids?.includes(user.uid)) {
            return;
        }


        count++;


        const other =
            d.memberUids.find(
                x => x !== user.uid
            );


        const name =
            d.memberNames?.[other] ||
            "Chat";


        const phone =
            d.memberPhones?.[other] ||
            "";


        const div =
            document.createElement("div");


        div.className = "item";


        div.innerHTML = `

            <div class="name">
                💬 ${esc(name)}
            </div>

            <div class="small">
                ${esc(phone)}
            </div>

        `;


        div.onclick = () => {

            openChat(
                item.id,
                name,
                phone,
                ""
            );

        };


        container.appendChild(div);

    });


    if (!count) {

        container.innerHTML = `

            <div
                class="empty"
                style="padding:30px;">
                No chats yet.<br><br>
                Search by phone number.
            </div>

        `;

    }

}


// ==========================================================
// REAL-TIME MESSAGES
// ==========================================================

function listenMessages() {

    if (stopMessages) {

        stopMessages();
        stopMessages = null;

    }


    const messages =
        collection(
            db,
            "directChats",
            activeChat.id,
            "messages"
        );


    stopMessages =
        onSnapshot(

            query(
                messages,
                orderBy("createdAt", "asc")
            ),

            snapshot => {

                const box =
                    document.getElementById(
                        "messages"
                    );


                box.innerHTML = "";


                if (snapshot.empty) {

                    box.innerHTML = `

                        <div class="empty">
                            No messages yet.
                        </div>

                    `;

                    return;

                }


                snapshot.forEach(item => {

                    drawMessage(
                        box,
                        item.id,
                        item.data()
                    );

                });


                box.scrollTop =
                    box.scrollHeight;

            }

        );

}


// ==========================================================
// DRAW MESSAGE
// ==========================================================

function drawMessage(
    box,
    messageId,
    data
) {

    const mine =
        data.senderId === user.uid;


    const row =
        document.createElement("div");


    row.className =
        "message " +
        (mine ? "me" : "");


    if (data.deleted) {

        row.innerHTML = `

            <div class="bubble">

                <div class="deleted">
                    🚫 This message was deleted.
                </div>

            </div>

        `;

    } else {

        const time =
            data.createdAt?.toDate
                ? data.createdAt.toDate()
                : new Date();


        row.innerHTML = `

            <div class="bubble">

                ${
                    !mine
                    ?
                    `<div class="sender">
                        ${esc(data.senderName)}
                    </div>`
                    :
                    ""
                }

                <div class="text">
                    ${esc(data.text)}
                </div>

                <div class="info">

                    ${time.toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit"
                    })}

                    <button
                        class="delete">
                        🗑
                    </button>

                </div>

            </div>

        `;


        row
            .querySelector(".delete")
            .onclick = async () => {

                if (
                    !confirm(
                        "Delete this message for everyone?"
                    )
                ) return;


                await updateDoc(

                    doc(
                        db,
                        "directChats",
                        activeChat.id,
                        "messages",
                        messageId
                    ),

                    {

                        deleted: true,

                        text: "",

                        deletedBy:
                            user.uid,

                        deletedAt:
                            serverTimestamp()

                    }

                );

            };

    }


    box.appendChild(row);

}


// ==========================================================
// SEND
// ==========================================================

document
.getElementById("form")
.addEventListener("submit", async event => {

    event.preventDefault();


    if (!activeChat) {

        alert("Select a chat.");
        return;

    }


    const input =
        document.getElementById("message");


    const text =
        input.value.trim();


    if (!text) return;


    await addDoc(

        collection(
            db,
            "directChats",
            activeChat.id,
            "messages"
        ),

        {

            senderId:
                user.uid,

            senderName:
                profile.name ||
                "Student",

            senderRole:
                "student",

            senderPhone:
                profile.phone || "",

            text,

            deleted: false,

            createdAt:
                serverTimestamp()

        }

    );


    input.value = "";

});


// ==========================================================
// MOBILE BACK
// ==========================================================

document
.getElementById("back")
.addEventListener("click", () => {

    document
        .getElementById("chatContainer")
        .classList.remove("open");

});


// ==========================================================
// LOGOUT
// ==========================================================

document
.getElementById("logout")
.addEventListener("click", async () => {

    await signOut(auth);

    location.href = "login.html";

});

</script>

</body>
</html>
