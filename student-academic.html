// ======================================================
// UPDATE MARKS FORM
// ======================================================

document.addEventListener(
    "submit",
    async event => {

        if (
            event.target.id !==
            "marksForm"
        ) {

            return;

        }


        const form =
            event.target;


        const editId =
            form.dataset.editId;


        if (!editId) {

            return;

        }


        event.preventDefault();


        const subject =
            document.getElementById(
                "marksSubject"
            ).value.trim();


        const exam =
            document.getElementById(
                "marksExam"
            ).value;


        const marks =
            Number(
                document.getElementById(
                    "marksObtained"
                ).value
            );


        const maxMarks =
            Number(
                document.getElementById(
                    "maxMarks"
                ).value
            );


        const button =
            document.getElementById(
                "marksSaveBtn"
            );


        if (
            !subject ||
            !exam ||
            !Number.isFinite(marks) ||
            !Number.isFinite(maxMarks)
        ) {

            showToast(
                "Please enter valid marks information.",
                "error"
            );

            return;

        }


        if (
            marks < 0 ||
            maxMarks <= 0 ||
            marks > maxMarks
        ) {

            showToast(
                "Invalid marks.",
                "error"
            );

            return;

        }


        button.disabled = true;

        button.textContent =
            "Updating...";


        try {

            await updateDoc(
                doc(
                    db,
                    "marks",
                    editId
                ),
                {

                    subject:
                        subject,

                    exam:
                        exam,

                    marks:
                        marks,

                    maxMarks:
                        maxMarks,

                    updatedAt:
                        serverTimestamp()

                }
            );


            showToast(
                "Marks updated successfully.",
                "success"
            );


            delete form.dataset.editId;


            button.textContent =
                "Save Marks";


            form.reset();


            document.getElementById(
                "maxMarks"
            ).value = "100";


            await loadMarks();


            renderMarks();

            updateSummary();

        }

        catch (error) {

            console.error(
                "Update marks error:",
                error
            );


            showToast(
                "Unable to update marks.",
                "error"
            );

        }

        finally {

            button.disabled = false;


            if (
                !form.dataset.editId
            ) {

                button.textContent =
                    "Save Marks";

            }

        }

    }
);


// ======================================================
// UPDATE SUMMARY
// ======================================================

function updateSummary() {

    const attendancePercentage =
        document.getElementById(
            "attendancePercentage"
        );


    const marksAverage =
        document.getElementById(
            "marksAverage"
        );


    const recordCount =
        document.getElementById(
            "recordCount"
        );


    // ==========================================
    // ATTENDANCE
    // ==========================================

    let present = 0;

    let totalAttendance = 0;


    attendanceRecords.forEach(
        record => {

            const status =
                normalizeAttendanceStatus(
                    record.status
                );


            if (
                status === "Present" ||
                status === "Absent"
            ) {

                totalAttendance++;

            }


            if (
                status === "Present"
            ) {

                present++;

            }

        }
    );


    const attendance =
        totalAttendance > 0

        ? (
            (present / totalAttendance) *
            100
          ).toFixed(1)

        : "0";


    attendancePercentage.textContent =
        `${attendance}%`;


    // ==========================================
    // MARKS
    // ==========================================

    let totalPercentage = 0;

    let marksCount = 0;


    marksRecords.forEach(
        record => {

            const marks =
                Number(
                    record.marks || 0
                );


            const maxMarks =
                Number(
                    record.maxMarks || 0
                );


            if (
                maxMarks > 0
            ) {

                totalPercentage +=
                    (marks / maxMarks) *
                    100;

                marksCount++;

            }

        }
    );


    const average =
        marksCount > 0

        ? (
            totalPercentage /
            marksCount
          ).toFixed(1)

        : "0";


    marksAverage.textContent =
        `${average}%`;


    // ==========================================
    // TOTAL RECORDS
    // ==========================================

    recordCount.textContent =
        attendanceRecords.length +
        marksRecords.length;

}


// ======================================================
// NORMALIZE ATTENDANCE
// ======================================================

function normalizeAttendanceStatus(
    value
) {

    const status =
        String(
            value || ""
        )
        .trim()
        .toLowerCase();


    if (
        status === "present" ||
        status === "p"
    ) {

        return "Present";

    }


    if (
        status === "absent" ||
        status === "a"
    ) {

        return "Absent";

    }


    return "";

}


// ======================================================
// TIMESTAMP
// ======================================================

function getTimestampMillis(
    value
) {

    if (
        value &&
        typeof value.toMillis ===
            "function"
    ) {

        return value.toMillis();

    }


    if (
        value &&
        typeof value.seconds ===
            "number"
    ) {

        return value.seconds * 1000;

    }


    return 0;

}


// ======================================================
// TOAST
// ======================================================

function showToast(
    message,
    type = ""
) {

    toast.textContent =
        message;


    toast.className =
        "";


    if (type) {

        toast.classList.add(
            type
        );

    }


    setTimeout(
        () => {

            toast.classList.add(
                "show"
            );

        },
        10
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        3500
    );

}


// ======================================================
// ERROR
// ======================================================

function showError(
    message
) {

    pageContent.innerHTML = `

        <div class="error-page">

            <div>

                ❌

                <br><br>

                ${escapeHTML(message)}

                <br><br>

                <button
                    class="back-btn"
                    onclick="
                        window.location.href =
                        'faculty-dashboard.html'
                    ">

                    ← Back to Faculty Dashboard

                </button>

            </div>

        </div>

    `;

}


// ======================================================
// HTML SECURITY
// ======================================================

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
