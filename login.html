<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | R Mohan Digital</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #2563eb, #0f172a);
        }

        .login-container {
            width: 420px;
            max-width: 90%;
            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .login-container h1 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        .login-container p.subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .login-form {
            text-align: left;
        }

        .login-form label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: 600;
        }

        .login-form input {
            width: 100%;
            height: 46px;

            padding: 12px 14px;

            border: 1px solid #ccc;
            border-radius: 8px;

            box-sizing: border-box;

            font-size: 15px;
            outline: none;

            margin-bottom: 18px;
        }

        .login-form input:focus {
            border-color: #2563eb;
        }

        /* Password */

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;

            right: 8px;
            top: 50%;

            transform: translateY(-50%);

            width: 35px;
            height: 35px;

            padding: 0;
            margin: 0;

            border: none;
            background: transparent;

            cursor: pointer;

            font-size: 18px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            background: transparent;
        }

        .login-btn-main {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #0f172a;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn-main:hover {
            background: #2563eb;
        }

        .message {
            margin-top: 18px;
            font-size: 14px;
            font-weight: 600;
        }

        .register-link {
            margin-top: 25px;
            color: #555;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-block;
            margin-top: 15px;

            color: #2563eb;
            text-decoration: none;

            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Student Login</h1>

        <p class="subtitle">
            Welcome back to R Mohan Digital
        </p>

        <form id="loginForm" class="login-form">

            <label for="loginEmail">Email Address</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

            <label for="loginPassword">Password</label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="toggleLoginPassword()"
                >
                    👁
                </button>

            </div>

            <button
                type="submit"
                class="login-btn-main"
            >
                Login
            </button>

        </form>

        <div id="loginMessage" class="message"></div>

        <p class="register-link">
            Don't have an account?
            <a href="register.html">Register Now</a>
        </p>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

    <!-- Firebase -->
    <script type="module" src="js/auth.js"></script>

</body>

</html>
