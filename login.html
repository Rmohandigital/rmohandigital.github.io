<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login | R Mohan Digital</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0f172a
                );
        }

        /* ==========================
           CONTAINER
        ========================== */

        .login-container {

            width: 450px;
            max-width: 100%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.30);

            text-align: center;
        }

        /* ==========================
           LOGO
        ========================== */

        .logo-circle {

            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #0f172a;

            border: 3px solid #2563eb;

            color: #00e5ff;

            font-size: 20px;

            font-weight: bold;

            box-shadow:
                0 0 20px
                rgba(37, 99, 235, 0.35);
        }

        h1 {

            color: #2563eb;

            margin: 0 0 6px;

            font-size: 27px;
        }

        .subtitle {

            color: #666;

            margin: 0 0 25px;

            font-size: 14px;
        }

        /* ==========================
           STUDENT BADGE
        ========================== */

        .student-badge {

            display: inline-block;

            padding: 7px 15px;

            border-radius: 20px;

            background:
                rgba(37, 99, 235, 0.10);

            color: #2563eb;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 22px;
        }

        /* ==========================
           FORM
        ========================== */

        .login-form {

            text-align: left;
        }

        .login-form label {

            display: block;

            margin-bottom: 7px;

            color: #333;

            font-weight: 600;

            font-size: 14px;
        }

        .login-form input {

            width: 100%;

            height: 46px;

            padding: 12px 14px;

            border:
                1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            margin-bottom: 18px;
        }

        .login-form input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }

        /* ==========================
           STUDENT ID
        ========================== */

        #loginEmail {

            background: #eef4ff;

            font-weight: 600;

            color: #1e3a8a;
        }

        /* ==========================
           PASSWORD
        ========================== */

        .password-wrapper {

            position: relative;

            width: 100%;
        }

        .password-wrapper input {

            padding-right: 50px;
        }

        .toggle-password {

            position: absolute;

            right: 8px;

            top: 50%;

            transform:
                translateY(-50%);

            width: 35px;
            height: 35px;

            padding: 0;

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;
        }

        /* ==========================
           PUZZLE
        ========================== */

        .puzzle-box {

            margin-top: 5px;

            margin-bottom: 22px;

            padding: 15px;

            border-radius: 12px;

            background: #f8fafc;

            border:
                1px solid #dbe3f0;
        }

        .puzzle-title {

            font-size: 14px;

            font-weight: bold;

            color: #334155;

            margin-bottom: 5px;
        }

        .puzzle-question {

            font-size: 13px;

            color: #64748b;

            margin-bottom: 12px;
        }

        .puzzle-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            max-width: 180px;

            margin: auto;
        }

        .puzzle-tile {

            width: 52px;
            height: 45px;

            border:
                1px solid #cbd5e1;

            border-radius: 8px;

            background: white;

            color: #1e293b;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .puzzle-tile:hover {

            border-color: #2563eb;

            transform:
                scale(1.05);
        }

        .puzzle-tile.correct {

            background: #dcfce7;

            border-color: #16a34a;

            color: #15803d;
        }

        .puzzle-tile.wrong {

            background: #fee2e2;

            border-color: #dc2626;

            color: #dc2626;
        }

        .puzzle-status {

            margin-top: 10px;

            font-size: 12px;

            font-weight: 600;

            min-height: 17px;
        }

        /* ==========================
           LOGIN BUTTON
        ========================== */

        .login-btn-main {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #0f172a;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn-main:hover {

            background: #2563eb;

            box-shadow:
                0 8px 20px
                rgba(37, 99, 235, 0.25);
        }

        .login-btn-main:disabled {

            opacity: 0.45;

            cursor: not-allowed;

            box-shadow: none;
        }

        /* ==========================
           MESSAGE
        ========================== */

        .message {

            min-height: 20px;

            margin-top: 17px;

            font-size: 14px;

            font-weight: 600;

            line-height: 1.5;
        }

        /* ==========================
           REGISTER
        ========================== */

        .register-link {

            margin-top: 23px;

            color: #555;

            font-size: 14px;
        }

        .register-link a {

            color: #2563eb;

            text-decoration: none;

            font-weight: 600;
        }

        .register-link a:hover {

            text-decoration: underline;
        }

        /* ==========================
           HOME
        ========================== */

        .back-home {

            display: inline-block;

            margin-top: 12px;

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;
        }

        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 500px) {

            .login-container {

                padding: 28px 20px;

                border-radius: 15px;
            }

            h1 {

                font-size: 23px;
            }

            .puzzle-tile {

                width: 48px;

                height: 42px;
            }
        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- LOGO -->

    <div class="logo-circle">
        RM
    </div>


    <h1>
        R Mohan Digital
    </h1>


    <p class="subtitle">
        Student Login
    </p>


    <div class="student-badge">
        🎓 Student Account
    </div>


    <!-- LOGIN FORM -->

    <form
        id="loginForm"
        class="login-form">


        <!-- STUDENT ID -->

        <label for="loginEmail">
            Student ID
        </label>


        <input
            type="text"
            id="loginEmail"
            placeholder="Student ID"
            autocomplete="username"
            required
        >


        <!-- PASSWORD -->

        <label for="loginPassword">
            Password
        </label>


        <div class="password-wrapper">

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >


            <button
                type="button"
                class="toggle-password"
                id="togglePassword">

                👁

            </button>

        </div>


        <!-- ==========================
             SMALL PUZZLE
        ========================== -->

        <div class="puzzle-box">

            <div class="puzzle-title">
                🧩 Quick Puzzle
            </div>

            <div class="puzzle-question">
                Find the number <b id="targetNumber">?</b>
            </div>


            <div
                class="puzzle-grid"
                id="puzzleGrid">
            </div>


            <div
                class="puzzle-status"
                id="puzzleStatus">

                Complete the puzzle to continue.

            </div>

        </div>


        <!-- LOGIN -->

        <button
            type="submit"
            id="loginButton"
            class="login-btn-main"
            disabled>

            Complete Puzzle First

        </button>


    </form>


    <!-- MESSAGE -->

    <div
        id="loginMessage"
        class="message">
    </div>


    <!-- REGISTER -->

    <p class="register-link">

        Don't have a student account?

        <a href="register.html">
            Register Now
        </a>

    </p>


    <!-- HOME -->

    <a
        href="index.html"
        class="back-home">

        ← Back to Home

    </a>


</div>


<script
    type="module"
    src="js/auth.js">
</script>


</body>

</html>
